name: เฟิร์มแวร์หรือ toolchain ทำให้บทเรียนพัง / Toolchain or firmware breakage
description: บทเรียนเคยใช้ได้ แต่ใช้ไม่ได้หลังเปลี่ยนเวอร์ชันเฟิร์มแวร์ SDK IDE หรือ emulator / A lesson stopped working after a firmware, SDK, IDE or emulator change.
title: "[toolchain] "
labels: ["toolchain"]
body:
  - type: markdown
    attributes:
      value: |
        ข้อมูลเวอร์ชันสำคัญที่สุด ช่วยใส่ให้ครบเท่าที่รู้ อย่าแปะรหัส Wi-Fi token หรือรหัสผ่าน broker ใน log
        Versions matter most; give as many as you know. Do not paste Wi-Fi passwords, tokens or broker passwords in logs.
  - type: input
    id: lessons
    attributes:
      label: บทเรียนที่พัง / Affected lessons
      placeholder: aiot-mpy.m03.l02, fw-sdk.m04.l01
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: ส่วนที่เปลี่ยน / What changed
      multiple: true
      options:
        - เฟิร์มแวร์ BENTO MicroPython / BENTO MicroPython firmware
        - ModusToolbox หรือ SDK / ModusToolbox or SDK
        - BENTO IDE
        - BENTO Emulator
        - ไลบรารีหรือแพ็กเกจ / Library or package
        - บอร์ดหรือฮาร์ดแวร์ / Board or hardware revision
        - ไม่แน่ใจ / Not sure
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: บอร์ด / Board
      placeholder: Eva Kit (KIT_PSE84_EVAL_EPC2) หรือ TESAIoT Dev Kit
    validations:
      required: false
  - type: input
    id: working
    attributes:
      label: เวอร์ชันที่ยังใช้ได้ / Last working version
    validations:
      required: false
  - type: input
    id: broken
    attributes:
      label: เวอร์ชันที่พัง / Broken version
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: ข้อความ error หรือ log / Error message or log
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: ขั้นตอนทำซ้ำ / Steps to reproduce
    validations:
      required: false
