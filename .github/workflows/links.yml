#
# Link checking with lychee (settings in lychee.toml).
#   pull_request              links between files in this repo only (--offline) — BLOCKING
#   schedule / workflow_dispatch   external links too — a report in the job summary, never blocking
name: links

on:
  pull_request:
  schedule:
    - cron: "23 2 * * 1"   # Mondays 02:23 UTC (09:23 in Thailand)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Internal links (offline, blocking)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline --no-progress './**/*.md'
          fail: true
          jobSummary: true

  external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: All links (report only)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: false
          jobSummary: true
