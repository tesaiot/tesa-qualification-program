          และขั้นตอนบนบอร์ดอาจเปลี่ยนก่อนออกรุ่นจริง เรียนและทดลองใน BENTO Emulator ได้ ถ้าเจอจุดที่ไม่ตรงกับที่เห็น แจ้งเราได้
        en: >-
          This course is still in development. It follows the BENTO edge AI firmware, which is being developed: function
          names, models and board steps may change before release. You can study and try it in the BENTO Emulator; if
          something does not match what you see, please tell us.

