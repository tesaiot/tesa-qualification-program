items:
  - id: q1
    objective: 1
    type: single
    prompt:
      th: สถาบันมีชั่วโมงแล็บน้อยและบอร์ดจำกัด แต่อยากให้ผู้เรียนได้ลงมือบนบอร์ดจริง รูปแบบใดเหมาะที่สุด
      en: An institution has few lab hours and limited boards but wants hands-on board time. Which model fits best?
    choices:
      - {th: วิชาเลือกเต็มที่บรรยายตลอดทุกสัปดาห์}
      - {th: ห้องเรียนกลับด้าน ให้อ่านและทำเช็กก่อนเข้าห้อง แล้วใช้เวลาในห้องกับแล็บ}
      - {th: ให้ผู้เรียนเรียนเองทั้งหมดโดยไม่มีกำหนดส่ง}
      - {th: ไม่ใช้บอร์ดเลย}
    answer: [1]
    explain:
      th: แบบ flipped ย้ายส่วนอ่านและเช็กไปก่อนเข้าห้อง เวลาในห้องที่มีบอร์ดจึงใช้กับสิ่งที่ต้องใช้บอร์ดจริง
  - id: q2
    objective: 1
    type: single
    prompt:
      th: ผู้สอนยังไม่คุ้นกับบอร์ดและอยากเริ่มภาคการศึกษาหน้า รูปแบบใดลดความเสี่ยงได้มากที่สุด
      en: The lecturer is new to the board and wants to start next term. Which model lowers risk most?
    choices:
      - {th: เปิดวิชาเลือกเต็มทันที}
      - {th: สอนร่วมกับ TESA หรือเริ่มจากแทรกหนึ่งโมดูล}
      - {th: ให้ผู้เรียนเรียนเองทั้งหมด}
      - {th: รอจนมีบอร์ดครบคนละชุด}
    answer: [1]
    explain:
      th: การสอนร่วมหรือแทรกโมดูลเดียวทำให้ได้ประสบการณ์และข้อมูลก่อนขยาย โดยไม่เสี่ยงทั้งรายวิชา
  - id: q3
    objective: 2
    type: single
    prompt:
      th: ในแผนช่วงสอน 1.5 ชั่วโมง ข้อใดผิดหลักการที่บทเรียนนี้ใช้
      en: In a 1.5-hour slot plan, which breaks the principle this lesson uses?
    choices:
      - {th: ให้ผู้เรียนเห็นของที่ทำงานได้ภายใน 15 นาทีแรก}
      - {th: บรรยายแนวคิดต่อเนื่อง 40 นาทีโดยไม่มีกิจกรรมคั่น}
      - {th: จบด้วยเช็กความเข้าใจ}
      - {th: สลับรูปแบบกิจกรรมทุก 6–10 นาที}
    answer: [1]
    explain:
      th: ช่วงกิจกรรมที่ไม่ใช่แล็บควรยาวไม่เกิน 6–10 นาที การบรรยายยาวต่อเนื่องทำให้ความสนใจลดลง
  - id: q4
    objective: 3
    type: multi
    prompt:
      th: มาตรการใดช่วยให้ผู้เรียนเรียนจบเมื่อใช้บทเรียนออนไลน์นอกห้องเรียน (เลือกได้มากกว่าหนึ่งข้อ)
      en: Which measures help learners finish when using online lessons outside class? (choose all that apply)
    choices:
      - {th: เรียนเป็นรุ่นพร้อมกันและมีกำหนดส่งรายบทเรียน}
      - {th: มีผู้สอนหรือพี่เลี้ยงคอยตอบคำถาม}
      - {th: ส่งข้อความเตือนอย่างเดียวโดยไม่มีโครงสร้างอื่น}
      - {th: วัดการเรียนจบรายบทเรียน และมีหลักฐานการเรียนจบ}
    answer: [0, 1, 3]
    explain:
      th: งานวิจัยพบว่าการกระตุ้นแบบเบา ๆ อย่างเดียวช่วยได้น้อย สิ่งที่ช่วยคือโครงสร้าง ได้แก่ รุ่น กำหนดส่ง ผู้สอน และหลักฐานการเรียนจบ
