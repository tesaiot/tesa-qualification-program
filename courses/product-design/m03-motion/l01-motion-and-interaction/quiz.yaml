  objective: 1
  type: single
  prompt:
    th: ก่อนใส่ keyframe การเปิดฝา ควรวาง origin ของฝาไว้ที่ใด
  choices:
  - th: ตำแหน่งกล้อง
  - th: กึ่งกลางของฉาก
  - th: ที่บานพับ
  - th: กึ่งกลางของฝา
