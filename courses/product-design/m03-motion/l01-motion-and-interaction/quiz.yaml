  explain:
    th: หัวข้อ 2.1 Place the origin at the hinge
- id: q2
  objective: 2
  type: single
  prompt:
    th: ชื่อคลิปใดเหมาะสำหรับส่งเข้า Twin
  choices:
  - th: '`lid_open`'
  - th: '`Anim1`'
  - th: '`เปิดฝา`'
  - th: '`final_final2`'
  answer:
  - 0
  explain:
    th: 'ตารางในหัวข้อ 3.4: ใช้ชื่อภาษาอังกฤษสั้น เลี่ยงชื่อว่าง ชื่อซ้ำ และภาษาไทยในชื่อคลิป'
- id: q3
  objective: 3
  type: single
  prompt:
