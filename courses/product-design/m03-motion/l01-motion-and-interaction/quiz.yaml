  - th: export ใหม่โดยไม่ต้องแก้อะไร
  - th: เลื่อนบานพับ ลดมุมเปิด หรือกลับไปแก้รูปทรงในโมดูล 2
  - th: เปิด Physics simulation ให้ชิ้นส่วนเด้งออก
  answer:
  - 2
  explain:
    th: 'หัวข้อ 4: Motion ที่ชนคือบั๊กดีไซน์ที่จับได้ถูกกว่าตอนพิมพ์แล้วค่อยรู้'
