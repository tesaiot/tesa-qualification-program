id: product-design
short: pdesign
title:
  th: การออกแบบผลิตภัณฑ์เชิงอุตสาหกรรม (Blender และ Digital Twin)
  en: Product Industrial Design (Blender & Twin)
summary:
  th: หลักสูตรเชิงปฏิบัติการออกแบบกล่องหุ้มผลิตภัณฑ์อัจฉริยะด้วย Blender ตั้งแต่แนวคิด block model วัสดุ PBR การเรนเดอร์ และแอนิเมชัน ไปจนถึงส่งออก GLB เข้า Digital Twin ตรวจสอบเชิงดิจิทัล และทำต้นแบบจริงพร้อม Design Report
  en: 'A hands-on course in designing smart-product enclosures with Blender: concept, block model, PBR materials, rendering and animation, then GLB export to a Digital Twin, digital validation and a physical prototype with a design report.'
level: L2
status: alpha
audience:
- public
- student
- developer
- entrepreneur
- educator
hours: 18
cover: {image: cover.webp}
hardware:
  emulator: false
  boards:
  - none
toolchain:
  blender: 4.5 (all manual links in the lessons point to the 4.5 manual)
  blender-add-ons: glTF 2.0 importer/exporter (bundled); 3D Print Toolbox for mesh checks in module 6
  bitstream-studio: 0.2.2 on VS Marketplace (TERNIONDEV.bitstream-studio) as the Twin host from module 4
  slicer: any FDM slicer (the source names Cura) for module 6
  optional-hardware: the real board (for fitment) and the TESAIoT_Hackathon web-app ex05/ex06 for in-enclosure sensor checks
prerequisites:
  courses: []
  skills: []
outcomes:
- th: ออกแบบกล่องหุ้มตามขนาดฮาร์ดแวร์จริงด้วยลำดับ Concept → Block → Final และหลัก clearance กับความหนาผนัง
  en: Design an enclosure to real hardware dimensions through Concept, Block and Final stages using clearance and wall-thickness rules.
- th: ขึ้นรูปรายละเอียด ใส่วัสดุ PBR จัดแสง และเรนเดอร์ภาพนำเสนอใน Blender
  en: Model detail, apply PBR materials, light the scene and render presentation images in Blender.
- th: สร้างแอนิเมชันเปิด–ปิดที่ตั้งชื่อคลิปแล้ว และตรวจการชนของชิ้นส่วนขณะเคลื่อนไหว
  en: Create named open/close animation clips and check parts for interference while they move.
- th: ส่งออกโมเดลเป็น GLB เข้า Twin (Bitstream Studio) พร้อมจุดเซ็นเซอร์และจุดโต้ตอบที่ตั้งชื่อแล้ว
  en: Export the model as GLB into the Twin (Bitstream Studio) with named sensor and interaction points.
- th: ตรวจสอบเชิงดิจิทัลด้วยสถานการณ์ใช้งาน และสรุปรายการแก้สามอันดับแรกก่อนสร้างต้นแบบ
  en: Validate the design digitally with usage scenarios and list the top three fixes before prototyping.
- th: เตรียม STL ตรวจ fitment กับบอร์ดจริง และเขียน Design Report ที่ผู้อื่นทำซ้ำได้
  en: Prepare STL files, check fitment against the real board and write a design report others can reproduce.
