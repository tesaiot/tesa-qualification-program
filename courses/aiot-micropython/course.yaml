schema_version: 1
id: aiot-micropython
short: aiot-mpy
title:
  th: 'AIoT in Action: จากหน้าจอสัมผัสสู่แพลตฟอร์ม IoT (MicroPython)'
  en: 'AIoT in Action: From Touch Screen to IoT Platform (MicroPython)'
summary:
  th: เรียน AIoT จากของจริงบนบอร์ด PSoC Edge (Eva Kit หรือ TESAIoT Dev Kit) ด้วย MicroPython ตั้งแต่เล่นแอปบนจอสัมผัส สั่งฮาร์ดแวร์ อ่านเซนเซอร์ขึ้นแดชบอร์ด ไปจนถึงส่งข้อมูลขึ้นแพลตฟอร์ม IoT ผ่าน MQTT และ TLS แล้วประกอบเป็น mini-product ของตัวเอง
  en: 'Learn AIoT hands-on with MicroPython on the PSoC Edge boards (Eva Kit or TESAIoT Dev Kit): play the touch-screen apps, drive the hardware, turn sensor readings into an HMI dashboard, send data to an IoT platform over MQTT and TLS, and assemble your own mini-product.'
level: L2
status: alpha
audience:
- public
- student
- developer
- entrepreneur
- educator
hours: 36
hardware:
  emulator: true
  boards:
  - eva-kit
  - devkit
toolchain:
  bento-firmware: BENTO MicroPython firmware for PSoC Edge E84 (Eva Kit KIT_PSE84_EVAL_EPC2, TESAIoT Dev Kit)
  micropython: 'BENTO build: gpio, lcd, ui, sensors, dsp, mic, wifi, mqtt, tesaiot'
  ide: BENTO IDE https://ide.tesaiot.dev/ (Program to Device, BENTO Emulator)
  platform: TESAIoT Community Edition (module 4) https://github.com/tesaiot/tesaiot-community-edition
prerequisites:
  courses: []
  skills:
  - skill: lang.python
    level: 1
outcomes:
- th: อธิบายสถาปัตยกรรมระบบ AIoT ว่าเซนเซอร์ การตัดสินใจบนอุปกรณ์ หน้าจอ และแพลตฟอร์มปลายทางแบ่งงานกันอย่างไร ตัดสินได้ว่างานใดควรจบบนบอร์ดและงานใดควรส่งออก และยกตัวอย่างการใช้งานในอุตสาหกรรมได้อย่างน้อยหนึ่งกรณี
  en: Explain how sensing, on-device decisions, the display and the destination platform share the work in an AIoT system, decide which work should stay on the board and which should leave it, and give at least one industrial example.
- th: เขียนโปรแกรม MicroPython ควบคุมฮาร์ดแวร์บนบอร์ด (LED ปุ่ม ปุ่มสัมผัส และค่าอนาล็อก) และสร้าง UI บนจอสัมผัสที่สถานะบนจอตรงกับสถานะของฮาร์ดแวร์จริงทุกครั้งที่ทดสอบ
  en: Write MicroPython programs that drive the board's hardware (LEDs, button, touch pads, analog input) and build a touch-screen UI whose on-screen state matches the real hardware in every test.
- th: อ่านข้อมูลเซนเซอร์ (IMU เข็มทิศ CapSense ลูกบิด) เลือกและใช้ตัวกรองสัญญาณที่เหมาะกับงาน แล้วออกแบบ HMI dashboard ที่แสดงผลแบบ real-time ภายในงบ widget และอัตราอัปเดตที่ตั้งไว้ และรันต่อเนื่องได้ 10 นาที
  en: Read sensor data (IMU, compass, CapSense, potentiometer), choose and apply a suitable filter, and design a real-time HMI dashboard that stays within its widget budget and update rate and runs for 10 minutes.
- th: เชื่อมบอร์ดเข้า WiFi ส่งและรับข้อมูลผ่าน MQTT ทั้งสองทิศทาง และเปรียบเทียบช่องทางพอร์ต 1883 กับช่องทาง MQTTs ที่เข้ารหัส TLS (serverTLS) ได้ว่าอะไรปลอดภัยขึ้นและอะไรยังไม่ได้รับการปกป้อง
  en: 'Connect the board to WiFi, send and receive data over MQTT in both directions, and compare the port 1883 channel with TLS-encrypted MQTTs (serverTLS): what it protects and what it still does not.'
- th: ประกอบทั้งหมดเป็น AIoT mini-product ที่แก้โจทย์จริงหนึ่งเรื่อง ทำงานต่อได้เมื่อเน็ตหลุด ส่งข้อมูลตาม schema ที่ออกแบบเอง และนำเสนอได้ภายใน 10 นาที
  en: Assemble everything into an AIoT mini-product that solves one real problem, keeps working when the network drops, sends data in a schema you designed, and present it in 10 minutes.
