modules:
- id: m01-ui-application
  title:
    th: แอปพลิเคชันบนจอที่มีอยู่แล้ว
    en: Existing UI-based Application
  summary:
    th: รู้จักบอร์ดจากแอปที่มากับเครื่อง ส่งข้อความแรกขึ้นจอด้วย lcd และ ui แล้วพาค่าจากบอร์ดออกไปบนเครือข่ายและรับคำสั่งกลับมา
- id: m02-ui-to-hardware
  title:
    th: จากจอสู่ฮาร์ดแวร์
    en: UI-to-Hardware Interfacing
  summary:
    th: สั่ง LED และอ่านปุ่มด้วย gpio สร้างแผงควบคุมบนจอสัมผัสที่คุมไฟจริง แล้วอ่านลูกบิดและ CapSense พร้อมกรองสัญญาณ
- id: m03-sensor-hmi
  title:
    th: แสดงผลเซนเซอร์บน HMI
    en: Sensor Visualization on HMI
  summary:
    th: แปลงความเร่งเป็นมุมเอียง สุ่มสัญญาณให้ถูกแล้ววาดกราฟ real-time และประกอบ Mini-HMI Dashboard สี่การ์ดที่รันต่อเนื่องได้
- id: m04-iot-connectivity
  title:
    th: เชื่อมต่อแพลตฟอร์ม IoT
    en: IoT Platform Connectivity
  summary:
    th: ต่อ WiFi อ่านค่าเครือข่ายให้เป็น ส่ง telemetry และรับ command ผ่าน MQTT ขึ้นแพลตฟอร์มที่ติดตั้งเอง แล้วย้ายขึ้น MQTTs ผ่าน TLS
- id: m05-capstone
  title:
    th: 'Capstone: AIoT Mini-Product'
    en: 'Capstone: AIoT Mini-Product'
  summary:
    th: เริ่มจากโจทย์จริง ออกแบบด้วย canvas และ schema แล้วประกอบ Sense → Decide → Show → Send เป็น mini-product ที่อยู่รอดเมื่อเน็ตหลุด และนำเสนอ 10 นาที
