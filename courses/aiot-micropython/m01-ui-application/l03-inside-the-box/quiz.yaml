# เช็กความเข้าใจ — aiot-mpy.m01.l03 บทเรียน 1.3
items:
- id: q1
  objective: 1
  type: single
  prompt:
    th: คุณอยากให้หลอด LED ทุกดวงวิ่งไล่กัน โดยใช้โค้ดชุดเดียวบนทั้ง Eva Kit และ Dev Kit ควรเขียนลูปแบบไหน
    en: You want every LED to run in sequence with one piece of code on both the Eva Kit and the Dev Kit. How should you write the loop?
  choices:
  - th: วนด้วย range(gpio.num_leds()) ให้บอร์ดบอกเองว่ามีกี่ดวง
  - th: วนด้วย range(3) เพราะ Eva Kit มีสามดวง
  - th: วนด้วย range(5) เพราะ Dev Kit มีมากที่สุด
  - th: เปิดคู่มือบอร์ดแล้วเขียนตัวเลขแยกไฟล์ละบอร์ด
  answer:
  - 0
  explain:
    th: จำนวน LED ต่างกันระหว่างสองบอร์ด (Eva 3 · Dev Kit 5) สไลด์ย้ำให้ถามบอร์ดด้วยโค้ดเสมอ ไม่ต้องจำเลข โค้ดชุดเดียวจึงวิ่งครบทุกดวงบนบอร์ดใบไหนก็ได้
- id: q2
  objective: 2
  type: single
  prompt:
    th: บน Eva Kit การเรียก sensors.init() ได้ OSError ข้อใดอธิบายถูกต้อง
    en: On the Eva Kit, sensors.init() raises OSError. Which explanation is correct?
  choices:
  - th: บน Eva Kit คอร์ CM55 เป็นเจ้าของบัสเซนเซอร์ การปฏิเสธนี้กันไม่ให้ Python ไปแย่งบัส ให้ใช้ sensors.snapshot() แทน
  - th: เซนเซอร์บนบอร์ดเสีย ต้องส่งซ่อม
  - th: ลืม import sensors ก่อนเรียก
  - th: Eva Kit ไม่มีเซนเซอร์ IMU
  answer:
  - 0
  explain:
    th: โค้ด Python อยู่ฝั่ง CM33 บน Eva Kit เซนเซอร์ทั้งหมดอยู่ใต้ CM55 จึงต้องขอค่าผ่าน IPC ส่วน Dev Kit ยอมให้เรียก init() ได้ แต่ snapshot() คืน dict รูปเดียวกันทั้งสองบอร์ด
- id: q3
  objective: 3
  type: single
  prompt:
    th: เครื่องจักรตัวหนึ่งสั่นผิดปกติ ระบบแบบ AIoT ต่างจากแบบ IoT อย่างไร
    en: A machine starts vibrating abnormally. How does an AIoT system differ from an IoT one?
  choices:
  - th: บอร์ดตัดสินเองที่หน้างานภายในเสี้ยววินาที ส่งขึ้นคลาวด์เฉพาะตอนผิดปกติ และยังทำงานได้เมื่อเน็ตหลุด
  - th: บอร์ดส่งค่าความสั่นทุกวินาทีขึ้นคลาวด์ให้คลาวด์ตัดสิน
  - th: AIoT ไม่ต้องใช้เซนเซอร์ เพราะคลาวด์เดาได้เอง
  - th: AIoT คือ IoT ที่ใช้ WiFi เร็วกว่า
  answer:
  - 0
  explain:
    th: หัวใจของ AIoT คือย้ายการตัดสินใจลงมาใกล้จุดเกิดเหตุ แล้วส่งขึ้นคลาวด์เฉพาะสิ่งที่มีความหมาย แบบ IoT ที่ส่งทุกวินาทีเปลืองเน็ต ช้า และตาบอดเมื่อเน็ตหลุด
- id: q4
  objective: 4
  type: single
  prompt:
    th: ในท่าที่ 3 ของ s01_hello_lcd.py ถ้าย้าย time.sleep_ms(800) ออกไปไว้นอกลูป (ลดการเยื้องบรรทัด) จะเห็นอะไรบนจอ
    en: In move 3 of s01_hello_lcd.py, if you move time.sleep_ms(800) outside the loop (dedent it), what do you see?
  choices:
  - th: ชื่อทุกคนขึ้นพร้อมกัน แล้วค่อยหน่วงครั้งเดียว
  - th: ชื่อขึ้นทีละคนเหมือนเดิม
  - th: ได้ SyntaxError
  - th: ขึ้นเฉพาะชื่อคนสุดท้าย
  answer:
  - 0
  explain:
    th: ใน Python การเยื้องบรรทัดคือความหมาย การหน่วงที่อยู่ในลูปทำให้ชื่อขึ้นทีละคน ย้ายออกไปนอกลูปมันจะทำงานครั้งเดียวหลังพิมพ์ครบทุกชื่อ
- id: q5
  objective: 4
  type: single
  prompt:
    th: ทำไมบรรทัดปิดท้ายสีเขียวในไฟล์ฝึกจึงแยกเป็นการเรียก lcd.print() สองครั้ง
    en: Why is the green closing line in the practice file split into two lcd.print() calls?
  choices:
  - th: ถ้ารวมกันแล้วชื่อทีมยาว อาจเกิน 127 ไบต์ ซึ่งจะถูกตัดเงียบ ๆ และ \n หายไปด้วย
  - th: lcd.print() ใส่แท็ก span ได้แค่หนึ่งครั้งต่อโปรแกรม
  - th: เพื่อให้สองบรรทัดเป็นคนละสี
  - th: เพราะ lcd.print() ต่อสตริงด้วย + ไม่ได้
  answer:
  - 0
  explain:
    th: ไทยตัวละ 3 ไบต์ บรรทัดที่ดูสั้นจึงกินโควตาเร็ว การแยกตั้งแต่ต้นกันไม่ให้ท้ายข้อความหายโดยไม่มี error และท่าที่ 5 ของไฟล์ก็วัดความยาวของ TAIL ให้เห็นบนมาตรวัดไบต์
