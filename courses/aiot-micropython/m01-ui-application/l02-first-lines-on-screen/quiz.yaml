# เช็กความเข้าใจ — aiot-mpy.m01.l02 บทเรียน 1.2
items:
- id: q1
  objective: 1
  type: single
  prompt:
    th: คุณสร้าง ui.Label บนหน้า Playground แล้วจอนิ่งไปราวสองวินาทีกว่าป้ายจะโผล่ สาเหตุที่น่าจะเป็นที่สุดคืออะไร
    en: You create a ui.Label on the Playground page and the screen stays still for about two seconds before it appears. What is the most likely cause?
  choices:
  - th: ยังไม่ได้เรียก ui.poll() หลังสร้าง widget
  - th: ตั้ง value= ผิด เพราะ value= คือตัวเลขที่ป้ายจะแสดง
  - th: ป้ายต้องใช้ lcd.print() แทนจึงจะขึ้นทันที
  - th: บอร์ดยังไม่ได้ต่อ WiFi
  answer:
  - 0
  explain:
    th: สร้างหรือแก้ ui.* แล้วต้องเคาะ ui.poll() หนึ่งครั้ง ถ้าไม่เคาะ ป้ายก็ยังมาแต่ช้าไปราวสองวินาที ส่วน value= บน ui.Label คือขนาดตัวอักษร
- id: q2
  objective: 1
  type: multi
  prompt:
    th: ข้อใดบอกปลายทางของข้อความได้ถูกต้อง เลือกทุกข้อที่ถูก
    en: Which statements about where text goes are correct? Choose all that apply.
  choices:
  - th: print() ขึ้นที่คอนโซลของ BENTO IDE ฝั่งคอม ไม่ได้ขึ้นบนจอบอร์ด
  - th: lcd.print() ไปรอในลิ้นชัก Console ต้องแตะปุ่มไอคอนสีเขียวมุมขวาล่างจึงจะเห็น
  - th: ui.Label ขึ้นบนหน้า Playground ได้โดยไม่ต้องกดอะไร
  - th: ทั้งสามคำสั่งขึ้นที่เดียวกัน ต่างกันแค่สีตัวอักษร
  answer:
  - 0
  - 1
  - 2
  explain:
    th: หนึ่งบรรทัดไปได้สามที่คนละที่กัน print() อยู่บนคอม lcd.print() อยู่ในลิ้นชัก Console และ ui.Label อยู่บนหน้าจอ จอเงียบจึงมักแปลว่าเรามองผิดที่
- id: q3
  objective: 2
  type: single
  prompt:
    th: คุณเรียก lcd.print() ครั้งเดียวกับข้อความภาษาไทยยาว 50 ตัวอักษร จะเกิดอะไรขึ้น
    en: You call lcd.print() once with a 50-character Thai string. What happens?
  choices:
  - th: ข้อความถูกตัดที่ 127 ไบต์โดยไม่มี error และ \n ท้ายบรรทัดหายไปด้วย
  - th: ได้ error บอกว่าข้อความยาวเกิน
  - th: จอขึ้นบรรทัดใหม่ให้เองจนครบทุกตัว
  - th: แสดงครบ เพราะ 50 ตัวอักษรยังไม่ถึง 127
  answer:
  - 0
  explain:
    th: ไทยหนึ่งตัวกิน 3 ไบต์ 50 ตัวจึงเป็น 150 ไบต์ เกินเพดาน 127 ไบต์ต่อครั้ง ส่วนเกินถูกตัดเงียบ ๆ นับด้วย len(text.encode()) ไม่ใช่ len(text)
- id: q4
  objective: 3
  type: single
  prompt:
    th: จอสถานะที่ค่าเปลี่ยนทุก 200 ms ควรเขียนแบบไหน
    en: How should a status screen whose value changes every 200 ms be written?
  choices:
  - th: สร้าง widget ครั้งเดียวนอกลูป เขียนทับด้วย .text() หรือ .value() และพิมพ์ลงลิ้นชักเฉพาะตอนระดับเปลี่ยน
  - th: สร้าง ui.Label ใหม่ในลูปทุกรอบ จะได้ค่าล่าสุดเสมอ
  - th: lcd.clear() แล้ววาดใหม่ทั้งหน้าทุก 200 ms
  - th: lcd.print() ทุกรอบ ประวัติจะได้ครบที่สุด
  answer:
  - 0
  explain:
    th: widget ที่สร้างในลูปคือ widget ใหม่ทุกรอบ ล้างจอถี่กว่าราว 5 ครั้งต่อวินาทีจะกระพริบ และลิ้นชักที่ยิงทุกรอบมีแต่บรรทัดซ้ำจนไม่มีใครอ่านไหว 08_status_screen.py จึงแยกงานจอกับงานลิ้นชักออกจากกัน
- id: q5
  objective: 4
  type: single
  prompt:
    th: ใน level_name() คุณเขียน if v >= 50 คืน "เริ่มสูง" ไว้ก่อน if v >= 80 คืน "ต้องรีบดู" ค่า 92 จะได้ผลอะไร
    en: In level_name() you check v >= 50 (returns "เริ่มสูง") before v >= 80 (returns "ต้องรีบดู"). What does 92 return?
  choices:
  - th: '"เริ่มสูง" โดยไม่มี error ใด ๆ'
  - th: '"ต้องรีบดู" เพราะ 92 มากกว่า 80'
  - th: SyntaxError เพราะเงื่อนไขซ้อนกัน
  - th: '"ปกติ"'
  answer:
  - 0
  explain:
    th: 92 ผ่านเงื่อนไข 50 ก่อนจึงตกช่องกลาง และไม่มีวันไปถึงช่องบน โดยไม่มี error ให้จับ ต้องเรียง if จากเงื่อนไขที่เข้มที่สุดลงมา
