# เช็กความเข้าใจ — aiot-mpy.m04.l05 บทเรียน 4.5
items:
- id: q1
  objective: 1
  type: multi
  prompt:
    th: ข้อใดถูกเกี่ยวกับค่าที่ `mqtt.publish(topic, payload)` คืน เลือกทุกข้อที่ถูก
    en: Which statements about what mqtt.publish(topic, payload) returns are correct? Choose all that apply.
  choices:
  - th: เรียกตอนยังไม่ได้ต่อ broker จะได้ OSError ไม่ใช่ False
  - th: ต่ออยู่แต่ส่งไม่ผ่านจะได้ False
  - th: ได้ True แปลว่า broker ได้รับข้อความแล้วแน่นอน
  - th: ใส่ `retain=True` เพิ่มได้ถ้าอยากให้ broker จำข้อความล่าสุด
  answer:
  - 0
  - 1
  explain:
    th: publish() มีสามทางออก OSError เมื่อยังไม่ได้ต่อ False เมื่อต่ออยู่แต่ส่งไม่ผ่าน และ True ที่แปลแค่ว่าส่งต่อให้ชั้นเครือข่ายแล้ว ที่ QoS 0 ไม่มีการยืนยันจาก broker ส่วน retain ไม่ใช่พารามิเตอร์ ใส่ไปได้ TypeError
- id: q2
  objective: 2
  type: single
  prompt:
    th: ทีมติดตั้ง TESAIoT CE เสร็จ เอกสารบอกพอร์ต 1883 แต่บอร์ดที่อยู่ใน LAN เดียวกันต่อ broker ไม่ได้เลย ควรแก้อย่างไร
    en: A team has installed TESAIoT CE. The docs say port 1883, but the board on the same LAN cannot reach the broker at all. What should they fix?
  choices:
  - th: แก้ `docker-compose.yml` จาก `127.0.0.1:11883:1883` เป็น `0.0.0.0:1883:1883` แล้วสั่ง `docker compose up -d emqx`
  - th: แก้ไฟล์เดียวกันแล้วสั่ง `docker compose restart` ก็พอ
  - th: ใส่ `BROKER = "localhost"` ในโค้ดบนบอร์ด
  - th: เปลี่ยนไปต่อพอร์ต 8884 ด้วยโมดูล `mqtt`
  answer:
  - 0
  explain:
    th: ไฟล์ตั้งค่าเผยแพร่จริงเป็น 11883 และผูกกับ loopback บอร์ดจึงเข้าไม่ถึง ต้องแก้เป็น 0.0.0.0:1883 และใช้ up -d เพราะ restart ไม่อ่านพอร์ตใหม่ localhost ชี้ไปที่ตัวบอร์ดเอง และโมดูล mqtt ต่อพอร์ต TLS ไม่ได้
- id: q3
  objective: 3
  type: order
  prompt:
    th: เรียงขั้นของการรับคำสั่ง toggle จาก broker มาสลับ LED ให้ถูกลำดับ
    en: Put the steps of taking a toggle command from the broker to switching the LED in order.
  choices:
  - th: แปลง `msg[1].decode()` แล้ว `json.loads()` ภายใน `try/except ValueError`
  - th: เรียก `mqtt.subscribe(TOPIC_CMD)` ครั้งเดียวก่อนเข้าลูป
  - th: ถ้า `cmd.get("cmd") == "toggle"` สลับตัวแปร `led_on` ที่จำไว้เอง แล้วสั่ง `lamp.value(...)`
  - th: เรียก `mqtt.get_message()` ทุกรอบลูป 100 ms
  - th: ตรวจว่า `msg is not None`
  answer:
  - 1
  - 3
  - 4
  - 0
  - 2
  explain:
    th: subscribe ครั้งเดียวแล้วถาม get_message() ทุกรอบ ซึ่งคืน None เมื่อไม่มีข้อความจึงต้องตรวจก่อน payload เป็น bytes ต้อง decode ก่อน json.loads และครอบ try เพราะคนส่งมั่วได้เสมอ สถานะ LED ต้องจำเอง เพราะค่าของขาบอกแค่ระดับ ณ วินาทีที่ถาม
- id: q4
  objective: 4
  type: single
  prompt:
    th: ทีมกด Ctrl-C แล้วรันไฟล์เดิมใหม่ทันที บอร์ดต่อติดแล้วหลุดสลับกันทั้งที่โค้ดไม่ผิด สาเหตุและทางแก้ที่ตรงที่สุดคืออะไร
    en: A team presses Ctrl-C and reruns the same file at once. The board connects and drops in turns though the code is correct. What is the most direct cause and fix?
  choices:
  - th: broker ยังนับว่าตัวเก่าอยู่จนครบ keepalive และ client_id เดิมยังถูกจอง ให้เรียก `mqtt.disconnect()` ใน `except KeyboardInterrupt:`
  - th: keepalive สั้นเกินไป ให้ตั้ง `keep_alive=600`
  - th: ต้องเรียก `if mqtt.disconnect():` ก่อน connect ทุกครั้ง
  - th: บอร์ดเสีย ต้องลงเฟิร์มแวร์ใหม่
  answer:
  - 0
  explain:
    th: ถ้าไม่บอกลา broker รอจนครบ keepalive กว่าจะยอมรับว่าเราไปแล้ว disconnect() คืนชื่อให้ว่างทันที แต่คืน None จึงใส่ใน if ไม่ได้ และคีย์เวิร์ดที่ถูกคือ keepalive ไม่ใช่ keep_alive
- id: q5
  objective: 4
  type: multi
  prompt:
    th: คนที่ดักจับสัญญาณ WiFi วงเดียวกับบอร์ดได้ ทำอะไรได้บ้างเมื่อบอร์ดของเราส่งผ่านพอร์ต 1883 เลือกทุกข้อที่ถูก
    en: What can someone who captures the WiFi the board is on do while our board sends over port 1883? Choose all that apply.
  choices:
  - th: อ่าน username และ password ของอุปกรณ์ได้
  - th: อ่านค่าเซนเซอร์ใน payload ได้
  - th: ปลอมเป็นอุปกรณ์ของเราส่งข้อมูลปลอมเข้าแพลตฟอร์มได้
  - th: ไม่ได้อะไรเลย เพราะ broker ขอรหัสผ่านก่อนต่อ
  answer:
  - 0
  - 1
  - 2
  explain:
    th: พอร์ต 1883 ไม่มีการเข้ารหัส ทุกไบต์รวมถึงรหัสผ่านเดินเป็นข้อความอ่านออก การขอรหัสผ่านไม่ช่วยเมื่อรหัสเองถูกอ่านได้ จึงใช้ 1883 ได้แค่ในสนามซ้อม ต่อได้กับต่อได้อย่างปลอดภัยเป็นคนละคำถาม
