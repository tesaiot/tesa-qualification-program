# เช็กความเข้าใจ — aiot-mpy.m02.l03 บทเรียน 2.3
items:
- id: q1
  objective: 1
  type: single
  prompt:
    th: ทีมเติมเฉพาะจุด 1–2 ในไฟล์ฝึกแล้วกด Program to Device จะเห็นอะไร
    en: A team fills only blanks 1-2 in the practice file and presses Program to Device. What will they see?
  choices:
  - th: ไฟวิ่งครบทุกดวง แต่กดปุ่มแล้วตัวนับไม่ขยับ เพราะ raw ยังเป็น False ที่ตั้งไว้ให้ไฟล์รันได้
  - th: โปรแกรมหยุดทันทีด้วย NameError เพราะยังไม่มีบรรทัด raw = btn.is_pressed()
  - th: ไฟไม่วิ่ง เพราะลูปต้องรอให้กดปุ่มก่อนจึงจะขยับไฟ
  - th: ไฟวิ่งและนับปุ่มได้ แต่นับเกินจริง เพราะยังไม่ได้เติมส่วนกันเด้ง
  answer:
  - 0
  explain:
    th: ไฟวิ่งเป็นงานที่ไม่พึ่งอินพุตจากใคร จึงทำงานได้ทันทีหลังจุด 1–2 ส่วน raw ถูกตั้งเป็น False ไว้ก่อน ไฟล์จึงไม่พัง แต่ปุ่มยังไม่ถูกอ่าน การเติมทีละกลุ่มแบบนี้ทำให้รู้ว่าถ้าปุ่มพังตอนหลัง ปัญหาไม่ได้อยู่ที่ไฟ
- id: q2
  objective: 2
  type: multi
  prompt:
    th: อาการคู่กับสาเหตุข้อใดถูกต้อง เลือกทุกข้อที่ถูก
    en: Which symptom-cause pairs are correct? Choose all that apply.
  choices:
  - th: กดหนึ่งครั้ง เลขขึ้น 3–5 ← ยังไม่ได้กันเด้ง หรือ DEBOUNCE_MS น้อยเกิน
  - th: กดแล้วเลขไม่ขึ้นเลย ← มี sleep_ms ยาวในลูป ปุ่มหลุดตอนหลับ
  - th: ไฟติดพร้อมกันสองดวง ← จุดดวงใหม่ก่อนดับดวงเดิม
  - th: จอไม่ขึ้นตัวเลขแต่ไฟวิ่งปกติ ← DEBOUNCE_MS สูงเกินไป
  - th: ไฟไม่วิ่ง ค้างดวงเดียว ← ลืม if stable
  answer:
  - 0
  - 1
  - 2
  explain:
    th: สามข้อแรกตรงกับตารางกับดัก ส่วนจอไม่ขึ้นตัวเลขทั้งที่ไฟวิ่งเกิดจากไม่ได้เปิดหน้า Playground ไว้ และไฟค้างดวงเดียวเกิดจาก last_step = now อยู่นอก if ส่วนการลืม if stable ทำให้เลขขึ้นทีละสอง
- id: q3
  objective: 3
  type: single
  prompt:
    th: ทำไม 07_button_to_broker.py ส่ง telemetry ซ้ำทุก 2 วินาที ทั้งที่สถานะอาจไม่ได้เปลี่ยนเลย
    en: Why does 07_button_to_broker.py resend telemetry every 2 seconds even when nothing has changed?
  choices:
  - th: เพราะ publish() ของเฟิร์มแวร์นี้ส่ง retain = false เสมอ broker ไม่เก็บใบล่าสุดไว้ หน้าเว็บที่เปิดทีหลังจึงต้องรอใบถัดไป
  - th: เพราะ broker สาธารณะตัดการเชื่อมต่อถ้าไม่มีข้อมูลเข้าภายใน 2 วินาที
  - th: เพราะกล่องรับของบอร์ดมีช่องเดียว ต้องส่งออกก่อนจึงจะรับได้
  - th: เพราะ event อาจส่งซ้ำ จึงต้องมี telemetry ไว้ลบใบที่ซ้ำ
  answer:
  - 0
  explain:
    th: publish() ส่ง retain = false เสมอแม้ docstring จะเขียนว่ารับ retain= ถ้าส่งเฉพาะตอนเปลี่ยน หน้าเว็บที่เปิดทีหลังจะจอว่าง การส่งซ้ำทุก 2 วินาทีทำให้หน้าเว็บที่เปิดช้าที่สุดก็ตามทันภายใน 2 วินาที
- id: q4
  objective: 3
  type: multi
  prompt:
    th: ข้อใดถูกต้องเกี่ยวกับการเขียน 07_button_to_broker.py รอบข้อจำกัดของเฟิร์มแวร์ เลือกทุกข้อที่ถูก
    en: Which statements about how 07_button_to_broker.py works around the firmware's limits are true? Choose all that apply.
  choices:
  - th: ต้องกันเด้งก่อน publish ไม่งั้นกดหนึ่งครั้งกลายเป็นหลายใบบน broker และคนที่อ่านอีกฝั่งแยกไม่ออกว่าใบไหนคือการกดจริง
  - th: ส่งสถานะไฟจากตัวแปร leds ที่ handle() จดไว้ ไม่ใช่จาก gpio.led(i).value()
  - th: หยิบ get_message() ทุกรอบลูป เพราะกล่องรับมีช่องเดียว ใบใหม่ทับใบเก่า
  - th: สองคนในทีมรันไฟล์ 07 ด้วย TEAM เดียวกันบนสองบอร์ดพร้อมกันได้ เพราะ broker แยกให้เอง
  - th: ถ้าสายหลุด publish() คืน False ให้เองอยู่แล้ว ไม่ต้องดักอะไร
  answer:
  - 0
  - 1
  - 2
  explain:
    th: client_id ซ้ำกันไม่ได้ ใครต่อทีหลังจะเตะคนก่อนหลุด ไฟล์ 07 ใช้ bento-aiot- ต่อด้วยชื่อทีม จึงรันได้บอร์ดเดียวต่อทีม และ publish() ตอนสายหลุดโยน OSError ไม่ได้คืน False จึงต้องให้ send() ดักไว้
- id: q5
  objective: 4
  type: multi
  prompt:
    th: ข้อใดถูกต้องเกี่ยวกับการจับเวลาในเกมกดเร็วทั้งห้อง (08_class_race.py) เลือกทุกข้อที่ถูก
    en: Which statements about timing in the class reaction game (08_class_race.py) are true? Choose all that apply.
  choices:
  - th: ทีมที่ผลขึ้นจอหน้าห้องก่อนอาจไม่ใช่ทีมที่เร็วที่สุด เพราะแต่ละบอร์ดสุ่มเวลารอเอง และข้อความเดินทางใช้เวลาไม่เท่ากัน
  - th: บอร์ดจดเวลาตอนขาเริ่มเปลี่ยน แล้วค่อยใช้เวลานั้นเมื่อกันเด้งยืนยันว่าเป็นการกดจริง
  - th: ถ้าจับเวลาตอนที่กันเด้งยืนยัน ทุกทีมจะได้เวลาเร็วกว่าจริง 40 ms
  - th: กดเร็วกว่า 100 ms หลังไฟติดถือเป็นสถิติที่ดีที่สุดของรอบ
  answer:
  - 0
  - 1
  explain:
    th: เราวัดบนบอร์ดระหว่างหลอดของมันเองกับปุ่มของมันเอง ทางเดินของข้อความจึงไม่อยู่ในตัวเลข กันเด้ง 40 ms ทำให้บอร์ดเชื่อช้ากว่านิ้ว ถ้าจับเวลาตอนเชื่อทุกทีมจะช้าเกินจริง และเร็วกว่า 100 ms นับเป็นออกตัวก่อน
