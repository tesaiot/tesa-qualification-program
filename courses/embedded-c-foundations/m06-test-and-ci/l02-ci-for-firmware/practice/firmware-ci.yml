name: firmware-ci

on:
  # TODO 1: ให้ workflow รันกับทุก pull request ด้วย ไม่ใช่เฉพาะ push เข้า main
  push:
    branches: [main]

# TODO 2: ให้ GITHUB_TOKEN มีสิทธิ์น้อยที่สุดที่พอ คืออ่านโค้ดได้อย่างเดียว

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # TODO 3: tag อย่าง v7 ถูกย้ายได้ ล็อก action ทุกตัวในไฟล์นี้ด้วย commit SHA เต็ม 40 ตัว
      #         (หาได้จาก git ls-remote https://github.com/actions/checkout refs/tags/v7.0.1)
      - uses: actions/checkout@v7
      - name: Fetch Unity v2.7.0
        run: git clone --depth 1 --branch v2.7.0 https://github.com/ThrowTheSwitch/Unity.git host-tests/unity
      - name: Unit tests, then prove they can fail
        run: bash ci.sh tests

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
