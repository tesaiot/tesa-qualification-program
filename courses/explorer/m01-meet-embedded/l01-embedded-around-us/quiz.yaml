items:
  - id: q1
    objective: 1
    type: single
    prompt:
      th: ในเครื่องซักผ้า ชิ้นส่วนใดทำหน้าที่ "สั่งงาน" (actuator)
      en: In a washing machine, which part "acts" (the actuator)?
    choices:
      - {th: เซนเซอร์วัดระดับน้ำ}
      - {th: โปรแกรมซักที่เลือกไว้}
      - {th: มอเตอร์ที่หมุนถัง}
      - {th: ปุ่มเลือกโหมด}
    answer: [2]
    explain:
      th: มอเตอร์เปลี่ยนการตัดสินใจให้เป็นการกระทำจริง เซนเซอร์คือส่วนรับรู้ โปรแกรมคือส่วนตัดสินใจ ส่วนปุ่มเป็นทางรับคำสั่งจากคน
  - id: q2
    objective: 1
    type: order
    prompt:
      th: เรียงจังหวะการทำงานของแอร์ที่ตั้งอุณหภูมิไว้ 25 องศา ให้ถูกลำดับ
      en: Put the steps of an air conditioner set to 25 degrees in order.
    choices:
      - {th: สั่งคอมเพรสเซอร์ให้หยุด}
      - {th: วัดอุณหภูมิห้องได้ 24 องศา}
      - {th: เทียบกับค่าที่ตั้งไว้ แล้วสรุปว่าห้องเย็นพอแล้ว}
    answer: [1, 2, 0]
    explain:
      th: รับรู้ก่อน แล้วตัดสินใจ แล้วจึงสั่งงาน ลำดับนี้วนซ้ำไปตลอดเวลาที่แอร์เปิดอยู่
  - id: q3
    objective: 2
    type: multi
    prompt:
      th: ข้อใดคือความต่างระหว่างไมโครคอนโทรลเลอร์กับคอมพิวเตอร์บนโต๊ะ (เลือกได้มากกว่าหนึ่งข้อ)
      en: Which are differences between a microcontroller and a desktop computer? (choose all that apply)
    choices:
      - {th: ไมโครคอนโทรลเลอร์มักทำงานเดียวตั้งแต่เปิดจนปิดเครื่อง}
      - {th: ไมโครคอนโทรลเลอร์มักต้องกินไฟน้อยและตัวเล็ก}
      - {th: ไมโครคอนโทรลเลอร์ต้องมีคีย์บอร์ดและเมาส์เสมอ}
      - {th: หลายงานของไมโครคอนโทรลเลอร์ต้องตอบสนองให้ทันเวลาที่กำหนด}
    answer: [0, 1, 3]
    explain:
      th: ระบบฝังตัวส่วนใหญ่ไม่มีคีย์บอร์ดหรือเมาส์เลย คนใช้ไม่รู้ด้วยซ้ำว่ามีคอมพิวเตอร์อยู่ข้างใน
  - id: q4
    objective: 3
    type: multi
    prompt:
      th: อุปกรณ์ใดต่อไปนี้มีระบบสมองกลฝังตัว (เลือกได้มากกว่าหนึ่งข้อ)
      en: Which of these devices contain an embedded system? (choose all that apply)
    choices:
      - {th: สวิตช์ไฟธรรมดาที่แค่ต่อหรือตัดวงจร}
      - {th: นาฬิกาข้อมือดิจิทัลที่นับก้าวได้}
      - {th: ไมโครเวฟที่ตั้งเวลาได้ด้วยปุ่มกด}
      - {th: เครื่องวัดความดันโลหิตแบบดิจิทัล}
      - {th: ไฟฉายที่กดแล้วติดเฉย ๆ}
    answer: [1, 2, 3]
    explain:
      th: สามชิ้นกลางมีส่วนที่ตัดสินใจ สวิตช์ไฟธรรมดากับไฟฉายแค่ต่อหรือตัดวงจร ไม่มีส่วนที่คิด
