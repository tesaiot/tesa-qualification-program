# เช็กความเข้าใจ — fw-stack.m05.l04 บทเรียน 5.4 · คำตอบอิงโค้ดของ tesaiot/developer-hub @ d2ed42c
items:
- id: q1
  objective: 1
  type: order
  prompt:
    th: เรียงขั้นตอนใน ota_run_update_cycle() ให้ถูกลำดับ
    en: Put the steps of ota_run_update_cycle() in order.
  choices:
  - th: ดาวน์โหลดเฟิร์มแวร์เป็นก้อน ๆ
  - th: ถามงานจากแพลตฟอร์มและอ่าน job document (version, download_url, file_hash, signature)
  - th: รายงานสถานะ success กลับแพลตฟอร์ม
  - th: ตรวจ integrity ของเฟิร์มแวร์ที่ได้มา
  - th: ติดตั้งหรือสลับไปใช้เฟิร์มแวร์ใหม่ผ่าน callback apply_firmware
  answer:
  - 1
  - 0
  - 3
  - 4
  - 2
  explain:
    th: ota_run_update_cycle() เรียก ota_check_for_update() → ota_download_firmware() → ota_verify_firmware() → apply_firmware() → ota_report_status("success") ถ้าขั้นใดล้มจะรายงาน failed พร้อมเหตุผลแล้วหยุดทันที ไม่ไปขั้นถัดไป
- id: q2
  objective: 2
  type: single
  prompt:
    th: ถามงานแล้วได้ HTTP 204 จาก job endpoint หมายความว่าอะไร
    en: The job endpoint answers HTTP 204. What does it mean?
  choices:
  - th: ยังไม่มีอัปเดตสำหรับอุปกรณ์นี้ client คืน OTA_NO_UPDATE และจบรอบโดยไม่รายงานว่าล้มเหลว
  - th: token หมดอายุ
  - th: มีอัปเดต แต่ต้องถามใหม่
  - th: เซิร์ฟเวอร์ล่ม
  answer:
  - 0
  explain:
    th: 'ตาม Protocol Details ใน README: 200 = มี job document, 204 = ไม่มีอัปเดต ตัวอย่าง CLI พิมพ์ No update available ส่วน ota_run_update_cycle() กรณี OTA_NO_UPDATE จะ return ทันทีโดยไม่เรียก ota_report_status() การแยก ‘ไม่มีงาน’ ออกจาก ‘error’ สำคัญ เพื่อไม่ให้แพลตฟอร์มเห็นอุปกรณ์ปกติเป็นอุปกรณ์ที่ล้มเหลว'
- id: q3
  objective: 2
  type: single
  prompt:
    th: รันตัวอย่าง CLI (main.c) จนดาวน์โหลดและตรวจผ่าน แพลตฟอร์มจะได้รับสถานะอะไรจากอุปกรณ์
    en: You run the CLI example (main.c) through download and verification. What status does the platform receive from the device?
  choices:
  - th: ได้รับ success ทันทีหลังตรวจผ่าน
  - th: ได้รับความคืบหน้าทุกขั้นแบบเรียลไทม์
  - th: ได้รับ failed เพราะยังไม่ได้ติดตั้ง
  - th: 'ยังไม่ได้รับอะไรเลย: main.c เรียก check → download → verify แล้วพิมพ์ผลลง console โดยไม่เรียก ota_report_status() และในไลบรารีเองฟังก์ชันนี้ก็ยังแค่ log (การ POST ไปยัง status endpoint เป็น TODO) สถานะจึงต้องอ่านจาก console'
  answer:
  - 3
  explain:
    th: 'ใน main.c กรณี OTA_OK จะพิมพ์ Download complete! และ Firmware verified successfully! ส่วน ota_report_status() ใน ota_client.c มีเพียง OTA_LOG กับ comment TODO: POST to status endpoint การรายงานกลับแพลตฟอร์มจริงต้องเติมส่วนที่ POST ไปยัง OTA_STATUS_ENDPOINT และควรรายงานหลังบูตเฟิร์มแวร์ใหม่สำเร็จ ไม่ใช่แค่หลังดาวน์โหลด'
- id: q4
  objective: 2
  type: single
  prompt:
    th: รันตัวอย่างตามคำสั่งใน README ซึ่งไม่ได้ใส่ --ca-cert โค้ดใน ota_client.c จัดการการตรวจใบรับรองของเซิร์ฟเวอร์อย่างไร
    en: You run the example exactly as the README shows, without --ca-cert. How does ota_client.c handle verification of the server certificate?
  choices:
  - th: ใช้ trust store ของระบบตรวจตามปกติ
  - th: ปฏิเสธการเชื่อมต่อทันที
  - th: 'ปิดการตรวจ: เมื่อ ca_cert_path ว่าง โค้ดตั้ง CURLOPT_SSL_VERIFYPEER และ CURLOPT_SSL_VERIFYHOST เป็น 0 (comment ว่า For testing) การเชื่อมต่อยังเข้ารหัสแต่ไม่รู้ว่าคุยกับเซิร์ฟเวอร์ตัวจริงหรือไม่ จึงควรส่ง -c ชี้ไปยัง CA bundle เสมอ'
  - th: ใช้ใบรับรองใน OPTIGA ตรวจแทน
  answer:
  - 2
  explain:
    th: ota_config.h ประกาศ SYSTEM_CA_BUNDLE_PATH ไว้ แต่โค้ดไม่ได้ใช้ กิ่ง else ใน ota_check_for_update() ปิดการตรวจทั้ง peer และ hostname สำหรับการทดสอบอาจสะดวก แต่ถ้านำไปใช้จริง ผู้โจมตีกลางทางปลอม job document แล้วชี้ download_url ไปยัง image ของตัวเองได้ ตรงข้ามกับหลักในบทเรียน 5.1–5.2 ที่ไม่ปิดการตรวจ TLS เด็ดขาด
- id: q5
  objective: 1
  type: single
  prompt:
    th: ที่ commit นี้ ota_verify_firmware() ยังเป็น TODO ที่คืน OTA_OK ทุกครั้งโดยไม่คำนวณ SHA-256 ถ้านำไปใช้บนบอร์ดตามนี้จะเสี่ยงอะไร
    en: At this commit, ota_verify_firmware() is still a TODO that always returns OTA_OK without computing SHA-256. What is the risk of porting it to a board as is?
  choices:
  - th: ไม่มีความเสี่ยง เพราะ TLS ป้องกันไว้แล้ว
  - th: ดาวน์โหลดช้าลง
  - th: image ที่เสียระหว่างทางหรือถูกดัดแปลงจะถูกติดตั้งได้ ต้องคำนวณ SHA-256 ของทั้ง image เทียบกับ file_hash และตรวจ signature ก่อนเรียก apply_firmware เสมอ
  - th: บอร์ดจะปฏิเสธทุกอัปเดต
  answer:
  - 2
  explain:
    th: TLS ป้องกันข้อมูลระหว่างทาง แต่ไม่ได้ยืนยันว่า image ที่เซิร์ฟเวอร์เก็บไว้หรือที่เขียนลง flash ครบและถูกต้อง การตรวจ integrity ที่ปลายทางจับได้ทั้งการดาวน์โหลดขาด การเขียน flash ผิด และไฟล์ที่ถูกแก้ ตัวอย่างนี้เป็นโครงอ้างอิงที่ download, verify และการ POST สถานะยังเป็น TODO จึงต้องเติมก่อนใช้งานจริง
