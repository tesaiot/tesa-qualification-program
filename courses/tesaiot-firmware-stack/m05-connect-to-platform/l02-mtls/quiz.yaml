# เช็กความเข้าใจ — fw-stack.m05.l02 บทเรียน 5.2 · คำตอบอิงโค้ดของ tesaiot/developer-hub @ d2ed42c
items:
- id: q1
  objective: 2
  type: single
  prompt:
    th: mTLS เพิ่มอะไรจาก Server-TLS
    en: What does mTLS add over Server-TLS?
  choices:
  - th: เข้ารหัสข้อมูลแรงขึ้น
  - th: ไม่ต้องตรวจใบรับรองของเซิร์ฟเวอร์อีก
  - th: ใช้ API key สองชั้น
  - th: ระหว่าง handshake เซิร์ฟเวอร์ขอใบรับรองของอุปกรณ์ และอุปกรณ์ต้องพิสูจน์ว่าถือ private key คู่กับใบรับรองนั้น จึงไม่ต้องส่งรหัสผ่านหรือ API key
  answer:
  - 3
  explain:
    th: ใน main.c ของ mTLS tls.client_cert และ tls.client_key ชี้ไปยังไฟล์ของอุปกรณ์ ส่วน username และ password เป็น NULL และ verify_peer ยังเป็น 1 อุปกรณ์จึงยังตรวจเซิร์ฟเวอร์เหมือนเดิม ความแรงของการเข้ารหัสช่องทางไม่ได้ต่างกัน
- id: q2
  objective: 1
  type: single
  prompt:
    th: ทำไม bundle ของอุปกรณ์ที่สร้างจาก CSR จึงไม่มี private key มาด้วย
    en: Why does the bundle for a CSR-based device not include the private key?
  choices:
  - th: เพราะไฟล์ใหญ่เกินไป
  - th: เพราะกุญแจถูกสร้างฝั่งอุปกรณ์ตอนทำ CSR และไม่เคยออกจากฝั่งนั้น แพลตฟอร์มได้แค่ CSR ที่มี public key ไปลงนาม bundle ที่รั่วจึงไม่ทำให้กุญแจรั่ว
  - th: เพราะแพลตฟอร์มลืมใส่ ต้องขอเพิ่ม
  - th: เพราะ mTLS ไม่ใช้ private key
  answer:
  - 1
  explain:
    th: scripts/generate_csr.sh สร้างกุญแจ (ค่าเริ่มต้น ECDSA) ด้วย openssl แล้ว chmod 600 ก่อนสร้าง CSR README เรียกสิ่งนี้ว่า security requirement และให้นำกุญแจจากเครื่องที่สร้างมาวางเองก่อนใช้งาน ถ้าไม่มีไฟล์กุญแจ โปรแกรมจะหยุดพร้อมข้อความ mTLS requires client_cert.pem and client_key.pem
- id: q3
  objective: 1
  type: single
  prompt:
    th: ส่ง HTTPS แบบ mTLS ไปที่พอร์ต 443 แทน 9444 ปัญหาที่ README เตือนไว้คืออะไร
    en: You send mTLS HTTPS to port 443 instead of 9444. What problem does the README warn about?
  choices:
  - th: ไม่มีปัญหา แค่ช้ากว่า
  - th: ต้องใส่ X-API-KEY เพิ่ม
  - th: 'ปลายทางไม่ใช่ endpoint ของ mTLS: README ระบุว่า ingest แบบ mTLS ต้องใช้ :9444 ไม่ใช่ 443 และเตือนเรื่อง SAN/โดเมนไม่ตรง พอร์ต 443 เป็นของ Server-TLS ที่ใช้ API key'
  - th: ใบรับรองของอุปกรณ์หมดอายุทันที
  answer:
  - 2
  explain:
    th: แพลตฟอร์มแยก listener ตามวิธีพิสูจน์ตัวตน mTLS ใช้ HTTPS 9444 และ MQTTS 8883 ส่วน Server-TLS ใช้ HTTPS 443 และ MQTTS 8884 เมื่อเชื่อมผิดพอร์ต ปลายทางจะไม่ขอหรือไม่ตรวจใบรับรองของอุปกรณ์ตามที่คาด การแก้ที่ถูกคือแก้ปลายทาง ไม่ใช่ปิดการตรวจ TLS
- id: q4
  objective: 2
  type: single
  prompt:
    th: ถ้า private key ของอุปกรณ์หนึ่งรั่ว ผลกระทบคืออะไร
    en: If one device's private key leaks, what is the impact?
  choices:
  - th: ผู้โจมตีปลอมเป็นอุปกรณ์ตัวนั้นได้ (เชื่อมต่อและ publish ในนามของมัน) จนกว่าใบรับรองจะถูกเพิกถอนและออกคู่กุญแจใหม่ ผลจำกัดอยู่ที่อุปกรณ์ตัวนั้น เพราะแต่ละตัวมีใบรับรองและ topic ของตัวเอง
  - th: อุปกรณ์ทุกตัวบนแพลตฟอร์มถูกปลอมได้
  - th: ไม่มีผล เพราะยังต้องมี CA certificate
  - th: ผู้โจมตีถอดรหัสข้อมูลของอุปกรณ์อื่นได้
  answer:
  - 0
  explain:
    th: ใบรับรองผูกกับ public key ของอุปกรณ์ ใครถือ private key คู่กันก็ผ่าน handshake ได้ ACL จำกัด topic เป็น device/<device_id>/… จึงจำกัดความเสียหาย การไม่ให้กุญแจออกจากชิปเลย (OPTIGA Trust M ในบทเรียน 5.3) คือทางลดความเสี่ยงนี้
- id: q5
  objective: 2
  type: multi
  prompt:
    th: เปรียบเทียบ Server-TLS กับ mTLS ข้อใดถูก (เลือกทุกข้อที่ถูก)
    en: Comparing Server-TLS and mTLS, which statements are true? (choose all that apply)
  choices:
  - th: 'Server-TLS: อุปกรณ์ต้องเก็บรหัสผ่านหรือ API key เป็นความลับ และส่งมันในอุโมงค์ TLS ทุกครั้งที่เชื่อมต่อ'
  - th: 'mTLS: ไม่มีความลับถูกส่งผ่านเครือข่ายระหว่างพิสูจน์ตัวตน อุปกรณ์แค่แสดงว่าถือกุญแจ'
  - th: mTLS ทำให้อุปกรณ์ไม่ต้องตรวจใบรับรองของเซิร์ฟเวอร์
  - th: 'mTLS มีภาระดูแลกุญแจ: ใบรับรองหมดอายุ ต้องต่ออายุหรือหมุนเวียน และต้องเก็บ private key ให้ปลอดภัย'
  - th: Server-TLS เข้ารหัสข้อมูลได้น้อยกว่า mTLS
  answer:
  - 0
  - 1
  - 3
  explain:
    th: ทั้งสองโหมดเข้ารหัสช่องทางเท่ากัน และอุปกรณ์ตรวจเซิร์ฟเวอร์เหมือนกัน (verify_peer = 1) ความต่างอยู่ที่วิธีพิสูจน์ตัวตนของอุปกรณ์ Server-TLS เริ่มง่ายแต่ความลับเดินทางทุกครั้ง mTLS แข็งแรงกว่าแต่ต้องมีระบบออกและต่ออายุใบรับรอง
