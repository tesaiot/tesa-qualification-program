# Check-for-understanding items written for TESA Open Knowledge from the lesson text (source: drsanti/TESAIoT-Courses).
items:
- id: q1
  objective: 1
  type: single
  prompt:
    th: ทำไมต้องใส่ `min` / `max` ให้เซ็นเซอร์ในโมเดล
  choices:
  - th: เพื่อให้ Simulator ทำงานเร็วขึ้น
  - th: เพราะรูปแบบ glTF บังคับ
  - th: เพื่อใช้เป็นชื่ออุปกรณ์ในรายงาน
  - th: เพื่อกันเทสที่อยู่นอกโลกจริงโดยไม่ตั้งใจ
  answer:
  - 3
  explain:
    th: ตารางในหัวข้อ 2.3 Defaults, ranges, and honesty
- id: q2
  objective: 2
  type: single
  prompt:
    th: ข้อใดเป็น behavior ที่ “ทดสอบได้” ตามแนวทางของบทเรียน
  choices:
  - th: เปิด Simulator ค้างไว้ทั้งวัน
  - th: WHEN temperature > 40 °C for 2 s THEN emit event "temp_high"
  - th: ค่าอุณหภูมิขยับบนกราฟ
  - th: โมเดล 3D ดูสมจริงขึ้น
  answer:
  - 1
  explain:
    th: 'หัวข้อ 3.1–3.2: behavior ต้องมีข้อตกลงว่าเมื่ออินพุตเกิดแล้วควรเกิดอะไร ถ้ามีแต่ค่าขยับจะวัดไม่ได้ว่า logic ถูก'
- id: q3
  objective: 3
  type: single
  prompt:
    th: รูปแบบไฟล์ที่บทเรียนแนะนำสำหรับส่งโมเดลเข้า Bitstream Studio / Twin เว็บ
  choices:
  - th: STL
  - th: OBJ
  - th: .blend
  - th: glTF Binary (.glb)
  answer:
  - 3
  explain:
    th: 'หัวข้อ 5.5: .glb เป็นไฟล์เดียวที่รวม mesh, materials และ animation ส่วน STL/OBJ/FBX ใช้ในงานต้นแบบ'
