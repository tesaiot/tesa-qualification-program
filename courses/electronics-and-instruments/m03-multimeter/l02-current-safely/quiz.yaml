items:
  - id: q1
    objective: 1
    type: order
    prompt:
      th: เรียงขั้นตอนการวัดกระแสของ LED ด้วยมิเตอร์แบบอนุกรมให้ถูกลำดับ
      en: Put the steps for measuring an LED's current with the meter in series in order.
    choices:
      - {th: เปิดไฟแล้วอ่านค่า}
      - {th: ปิดไฟ}
      - {th: ย้ายสายแดงกลับช่อง VΩ}
      - {th: ย้ายสายแดงไปช่อง mA หมุนปุ่มไปโหมดกระแส แล้วตัดวงจรหนึ่งจุดและต่อมิเตอร์เข้าไปแทน}
      - {th: ปิดไฟ ถอดมิเตอร์ และต่อวงจรคืน}
    answer: [1, 3, 0, 4, 2]
    explain:
      th: เปลี่ยนการต่อทุกครั้งตอนปิดไฟ และขั้นสุดท้ายต้องเป็นการย้ายสายแดงกลับช่อง VΩ เสมอ เพื่อไม่ให้การวัดแรงดันครั้งถัดไปกลายเป็นการลัดวงจร
  - id: q2
    objective: 1
    type: single
    prompt:
      th: จะวัดกระแสราว 5 mA ของ LED ต้องเสียบสายแดงช่องไหน และต่อมิเตอร์อย่างไร
      en: To measure about 5 mA through an LED, which jack takes the red lead and how is the meter connected?
    choices:
      - {th: ช่อง VΩ ต่อคร่อม LED}
      - {th: ช่อง mA ต่ออนุกรมแทนสายเส้นหนึ่งของวงจร}
      - {th: ช่อง 10A ต่อคร่อมแหล่งจ่าย}
      - {th: ช่อง COM ต่อขนานกับตัวต้านทาน}
    answer: [1]
    explain:
      th: กระแสต้องไหลผ่านมิเตอร์ จึงต้องตัดวงจรแล้วต่ออนุกรม และ 5 mA อยู่ในย่านของช่อง mA ซึ่งมีฟิวส์ขนาดเล็กป้องกัน
  - id: q3
    objective: 2
    type: single
    prompt:
      th: ทำไมการแตะสายวัดคร่อมแหล่งจ่ายขณะมิเตอร์อยู่ในโหมดกระแสจึงอันตราย
      en: Why is touching the leads across a supply dangerous while the meter is in current mode?
    choices:
      - {th: เพราะมิเตอร์จะแสดงค่าติดลบ}
      - {th: เพราะในโหมดกระแส มิเตอร์มีความต้านทานภายในต่ำมาก จึงเท่ากับลัดวงจรแหล่งจ่าย กระแสสูงทำให้ฟิวส์ขาดหรือเกิดความเสียหาย}
      - {th: เพราะมิเตอร์จะวัดแรงดันได้ไม่แม่น}
      - {th: ไม่อันตราย มิเตอร์จะเปลี่ยนเป็นโหมดแรงดันเอง}
    answer: [1]
    explain:
      th: shunt ภายในมีค่าเพียงไม่กี่โอห์มหรือต่ำกว่านั้น เช่น 5 Ω คร่อม 3.3 V ได้ 0.66 A เกินฟิวส์ช่อง mA ส่วนแหล่งจ่ายกระแสสูงอย่างแบตเตอรี่ลิเทียมหรือไฟบ้าน อาจทำให้เกิดความร้อนหรือประกายไฟรุนแรง
  - id: q4
    objective: 2
    type: multi
    prompt:
      th: นิสัยใดช่วยป้องกันอุบัติเหตุจากโหมดวัดกระแส (เลือกได้มากกว่าหนึ่งข้อ)
      en: Which habits prevent accidents with the current mode? (choose all that apply)
    choices:
      - {th: ย้ายสายแดงกลับช่อง VΩ ทันทีหลังวัดกระแสเสร็จ}
      - {th: ถ้าไม่รู้ขนาดกระแส เริ่มจากช่องและย่านที่ใหญ่ที่สุดก่อน}
      - {th: วัดกระแสโดยแตะสายคร่อมชิ้นส่วนแบบเดียวกับวัดแรงดัน}
      - {th: ใช้วิธีวัดแรงดันคร่อมตัวต้านทานที่รู้ค่าแทน เมื่อทำได้}
    answer: [0, 1, 3]
    explain:
      th: การแตะคร่อมในโหมดกระแสคือความผิดพลาดที่ทำให้ฟิวส์ขาด การวัดแรงดันคร่อมตัวต้านทานแล้วใช้ I = V / R ไม่ต้องย้ายสายและไม่ต้องตัดวงจร จึงปลอดภัยที่สุด
  - id: q5
    objective: 3
    type: single
    prompt:
      th: คำนวณกระแส LED ได้ 4.81 mA แต่ต่อมิเตอร์อนุกรมวัดได้ 4.64 mA คำอธิบายใดสมเหตุสมผลที่สุด
      en: You calculated 4.81 mA for an LED, but the series meter reads 4.64 mA. Which explanation is most reasonable?
    choices:
      - {th: LED เสีย}
      - {th: มิเตอร์เสีย ต้องเปลี่ยนเครื่อง}
      - {th: ความต้านทานภายในของมิเตอร์ (burden) รวมกับความคลาดของตัวต้านทานและแรงดันจริงที่ไม่ตรงค่าบนกระดาษ}
      - {th: กฎของโอห์มใช้กับ LED ไม่ได้}
    answer: [2]
    explain:
      th: ต่างกันราว 3.5% ซึ่งอยู่ในขนาดที่ burden ของมิเตอร์ (เช่น 10 Ω ในวงจร 270 Ω) และตัวต้านทาน ±5% อธิบายได้ วิธีตรวจคือคำนวณใหม่ด้วยค่าที่วัดได้จริงแล้วเทียบอีกครั้ง
