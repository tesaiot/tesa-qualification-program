items:
  - id: q1
    objective: 1
    type: single
    prompt:
      th: บนเบรดบอร์ดมาตรฐาน รู a10 กับ e10 (ฝั่งเดียวกันของร่องกลาง แนวเดียวกัน) ต่อถึงกันหรือไม่
      en: On a standard breadboard, are holes a10 and e10 (same side of the channel, same strip) connected?
    choices:
      - {th: ต่อกัน เป็นกลุ่มห้ารูเดียวกัน}
      - {th: ไม่ต่อกัน}
      - {th: ต่อกันเฉพาะเบรดบอร์ดยาว}
      - {th: ต่อกันผ่านรางไฟ}
    answer: [0]
    explain:
      th: รู a ถึง e ในแนวเดียวกันอยู่บนแถบโลหะแถบเดียว จึงเป็นจุดเดียวกันทางไฟฟ้า
  - id: q2
    objective: 1
    type: single
    prompt:
      th: รู e10 กับ f10 ต่อถึงกันหรือไม่
      en: Are holes e10 and f10 connected?
    choices:
      - {th: ต่อกัน เพราะอยู่แนวเดียวกัน}
      - {th: ไม่ต่อกัน เพราะร่องกลางแยกสองฝั่งออกจากกัน}
      - {th: ต่อกันเมื่อเสียบชิปคร่อมร่อง}
      - {th: ขึ้นกับสีของเส้นบนรางไฟ}
    answer: [1]
    explain:
      th: ร่องกลางออกแบบให้ขาสองแถวของชิป DIP อยู่คนละจุดกัน f ถึง j จึงเป็นอีกกลุ่มหนึ่ง
  - id: q3
    objective: 1
    type: single
    prompt:
      th: เสียบตัวต้านทานโดยขาหนึ่งอยู่ b15 และอีกขาอยู่ d15 จะเกิดอะไรขึ้น
      en: A resistor is inserted with one leg in b15 and the other in d15. What happens?
    choices:
      - {th: ทำงานปกติ}
      - {th: ตัวต้านทานถูกลัดทิ้ง เพราะทั้งสองขาอยู่ในกลุ่มห้ารูเดียวกัน}
      - {th: ตัวต้านทานไหม้ทันที}
      - {th: ค่าความต้านทานเพิ่มเป็นสองเท่า}
    answer: [1]
    explain:
      th: ขาทั้งสองอยู่บนแถบโลหะเดียวกัน แรงดันคร่อมเป็นศูนย์ ไม่มีกระแสผ่าน วงจรทำงานเหมือนไม่มีตัวต้านทานตัวนั้น
  - id: q4
    objective: 2
    type: single
    prompt:
      th: ก่อนจ่ายไฟ วัดโหมดความต่อเนื่องระหว่างราง + กับราง − ผลแบบใดที่ควรได้
      en: Before powering, you check continuity between the + and − rails. What result should you get?
    choices:
      - {th: เครื่องส่งเสียงดัง แสดงว่าต่อครบ}
      - {th: เครื่องไม่ส่งเสียง และความต้านทานใกล้เคียงค่าที่คำนวณจากวงจร}
      - {th: อ่านได้ 0 Ω}
      - {th: ไม่ต้องตรวจ ถ้าต่อตามแผนผังแล้ว}
    answer: [1]
    explain:
      th: ถ้าดังแปลว่าไฟเลี้ยงลัดลงกราวด์ ห้ามจ่ายไฟ ค่าที่ควรได้คือความต้านทานรวมของวงจรที่คำนวณไว้ล่วงหน้า หรือ OL ถ้าวงจรไม่มีทางเดินกระแสระหว่างราง
  - id: q5
    objective: 2
    type: order
    prompt:
      th: เรียงขั้นตอนตั้งแต่ต่อวงจรเสร็จจนจ่ายไฟ ให้ถูกลำดับ
      en: Put the steps from a finished build to power-on in order.
    choices:
      - {th: ต่อไฟเลี้ยงและสายสัญญาณ แล้ววัดแรงดันราง}
      - {th: ตรวจด้วยตาทีละ net เทียบกับแผนผัง}
      - {th: ต่อสาย GND ระหว่างบอร์ดกับเบรดบอร์ด}
      - {th: วัดความต่อเนื่องและความต้านทานระหว่างราง + กับราง −}
    answer: [1, 3, 2, 0]
    explain:
      th: ตรวจทั้งหมดขณะยังไม่มีไฟ ด้วยตาก่อนแล้วด้วยมิเตอร์ แล้วจึงต่อกราวด์เป็นเส้นแรก ตามด้วยไฟเลี้ยงและสัญญาณ
