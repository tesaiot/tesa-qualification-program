items:
  - id: q1
    objective: 1
    type: single
    prompt:
      th: จุดบัดกรีที่ดีของขาหัวต่อบนแผ่นทองแดงมีลักษณะอย่างไร
      en: What does a good solder joint on a header pin look like?
    choices:
      - {th: ก้อนกลมใหญ่ครอบขา ยิ่งตะกั่วมากยิ่งแข็งแรง}
      - {th: กรวยเว้าเข้าเรียบ ตะกั่วเกาะทั้งขาและแผ่นทองแดงโดยไม่มีร่อง}
      - {th: ผิวขรุขระด้านและมีร่องรอบแผ่นทองแดง}
      - {th: ตะกั่วเชื่อมไปถึงขาข้าง ๆ เพื่อให้แน่นหนา}
    answer: [1]
    explain:
      th: รูปกรวยเว้าแสดงว่าตะกั่วเปียกผิว (wetting) ทั้งขาและแผ่น ก้อนกลมที่มีร่องคือจุดเย็น ส่วนตะกั่วที่เชื่อมถึงขาข้าง ๆ คือสะพานตะกั่ว
  - id: q2
    objective: 1
    type: single
    prompt:
      th: หลังบัดกรีหัวต่อหนึ่งแถว จะตรวจหาสะพานตะกั่วด้วยมัลติมิเตอร์อย่างไร
      en: After soldering a header row, how do you check for solder bridges with a multimeter?
    choices:
      - {th: เปิดไฟแล้ววัดแรงดันทุกขา}
      - {th: ถอดไฟ ใช้โหมดความต่อเนื่องวัดคู่ขาที่ติดกันทีละคู่ ต้องไม่ดัง ยกเว้นคู่ที่แผนผังบอกว่าต่อกัน}
      - {th: วัดกระแสผ่านแต่ละขา}
      - {th: วัดความต่อเนื่องจากขาไปลายวงจร ถ้าดังแปลว่ามีสะพาน}
    answer: [1]
    explain:
      th: สะพานคือการต่อกันของขาที่ไม่ควรต่อ จึงต้องวัดระหว่างขาติดกัน ส่วนการวัดจากขาไปลายวงจรใช้หาจุดเย็นหรือลายขาด (ต้องดัง)
  - id: q3
    objective: 1
    type: single
    prompt:
      th: จุดหนึ่งเป็นก้อนกลมด้าน มีร่องรอบแผ่นทองแดง และมิเตอร์บอกว่าขาไม่ต่อกับลายวงจร ควรแก้อย่างไร
      en: A joint is a dull ball with a gap around the pad, and the meter shows no connection to the trace. How do you fix it?
    choices:
      - {th: เติมตะกั่วก้อนใหญ่ทับลงไป}
      - {th: เติมฟลักซ์ แล้วให้ความร้อนใหม่ให้ถึงทั้งขาและแผ่นทองแดงจนตะกั่วไหลเป็นกรวย}
      - {th: เพิ่มอุณหภูมิหัวแร้งเป็น 500 °C}
      - {th: ใช้กาวยึดขาแทน}
    answer: [1]
    explain:
      th: นี่คือจุดเย็น ตะกั่วไม่ได้เปียกแผ่นทองแดง ฟลักซ์ขจัดออกไซด์และความร้อนที่ถึงทั้งสองผิวทำให้ตะกั่วไหลเกาะ อุณหภูมิสูงเกินทำให้แผ่นหลุดและฟลักซ์ไหม้
  - id: q4
    objective: 2
    type: multi
    prompt:
      th: ข้อใดเป็นข้อปฏิบัติด้านความปลอดภัยที่ถูกต้องในงานบัดกรี (เลือกได้มากกว่าหนึ่งข้อ)
      en: Which are correct soldering safety practices? (choose all that apply)
    choices:
      - {th: ดูดควันออกจากจุดทำงาน และไม่ก้มหน้าเข้าหาควัน}
      - {th: ใส่สายรัดข้อมือกันไฟฟ้าสถิตและจับบอร์ดที่ขอบ}
      - {th: กินขนมที่โต๊ะบัดกรีได้ ถ้าใช้ตะกั่วไร้สารตะกั่ว}
      - {th: ใส่แว่นตานิรภัย}
      - {th: ถ้าหัวแร้งหล่น ให้รีบคว้าไว้ก่อนตกพื้น}
    answer: [0, 1, 3]
    explain:
      th: ควันฟลักซ์เป็นสาเหตุที่พบบ่อยของโรคหืดจากการทำงาน ไฟฟ้าสถิตทำลายชิปได้โดยไม่รู้สึก และตะกั่วกับเศษขากระเด็นเข้าตาได้ ไม่ควรกินหรือดื่มที่โต๊ะบัดกรีเลย และห้ามคว้าหัวแร้งที่หล่นเพราะอาจจับโดนปลายที่ร้อน
  - id: q5
    objective: 2
    type: single
    prompt:
      th: ทำไมสายรัดข้อมือกันไฟฟ้าสถิตต้องมีตัวต้านทานราว 1 MΩ คั่นก่อนลงกราวด์
      en: Why does an ESD wrist strap have about 1 MΩ in series to ground?
    choices:
      - {th: เพื่อให้ประจุไหลออกเร็วที่สุด}
      - {th: เพื่อให้ประจุไหลลงดินอย่างปลอดภัย และจำกัดกระแสผ่านร่างกายถ้ามือไปแตะจุดที่มีไฟ}
      - {th: เพื่อวัดความชื้นของผิว}
      - {th: ไม่จำเป็น ต่อลงกราวด์ตรง ๆ ได้ดีกว่า}
    answer: [1]
    explain:
      th: ถ้ามือแตะไฟ 230 V ตัวต้านทาน 1 MΩ จำกัดกระแสไว้ไม่เกินราว 0.23 mA การต่อตรงลงกราวด์ทำให้ร่างกายกลายเป็นทางไหลของกระแสเต็มที่
