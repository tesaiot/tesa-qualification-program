items:
  - id: q1
    objective: 1
    type: single
    prompt:
      th: ทำไมตัวเก็บประจุ decoupling ต้องวางชิดขาไฟของชิปที่สุด
      en: Why must a decoupling capacitor sit as close as possible to the chip's power pin?
    choices:
      - {th: เพื่อให้ค่าความจุเพิ่มขึ้น}
      - {th: เพื่อให้ลูประหว่างขาไฟ ตัวเก็บประจุ และกราวด์เล็ก ความเหนี่ยวนำต่ำ จ่ายกระแสเร็วได้ทันที}
      - {th: เพื่อให้ประกอบง่าย}
      - {th: เพื่อป้องกันไฟฟ้าสถิตที่ขั้วต่อ}
    answer: [1]
    explain:
      th: ลายวงจรทุกมิลลิเมตรเพิ่มความเหนี่ยวนำราว 1 nH เหนือความถี่เรโซแนนซ์ตัวเก็บประจุทำตัวเหมือนตัวเหนี่ยวนำ ตำแหน่งจึงสำคัญกว่าค่าความจุที่ความถี่สูง
  - id: q2
    objective: 1
    type: single
    prompt:
      th: ระนาบกราวด์ต่อเนื่องใต้ลายสัญญาณช่วยเรื่องใดมากที่สุด
      en: What does a continuous ground plane under signal traces help most with?
    choices:
      - {th: ทำให้กระแสไหลกลับวิ่งใต้ลายสัญญาณพอดี ลูปเล็ก แผ่คลื่นและรับสัญญาณรบกวนน้อย}
      - {th: ทำให้บอร์ดแข็งแรงขึ้น}
      - {th: ลดแรงดันไฟเลี้ยง}
      - {th: ทำให้สัญญาณวิ่งเร็วขึ้นกว่าความเร็วแสง}
    answer: [0]
    explain:
      th: กระแสความถี่สูงเลือกทางกลับที่มีความเหนี่ยวนำน้อยที่สุด ซึ่งคือใต้ลายสัญญาณ ถ้าระนาบมีร่องใต้ลาย กระแสต้องอ้อมและลูปใหญ่ขึ้น
  - id: q3
    objective: 2
    type: multi
    prompt:
      th: ข้อใดทำให้บอร์ดแผ่คลื่นรบกวนหรือไวต่อสัญญาณรบกวนมากขึ้น (เลือกได้มากกว่าหนึ่งข้อ)
      en: Which of these make a board emit or pick up more interference? (choose all that apply)
    choices:
      - {th: ลายสัญญาณนาฬิกาวิ่งข้ามร่องของระนาบกราวด์}
      - {th: ขอบสัญญาณเร็วกว่าที่งานต้องการมาก}
      - {th: สายเคเบิลยาวที่ไม่มีตัวกรองที่ขั้วต่อ}
      - {th: ระนาบกราวด์เต็มแผ่นไม่มีร่อง}
      - {th: ขาเข้าที่ปล่อยลอย}
    answer: [0, 1, 2, 4]
    explain:
      th: ลูปใหญ่ ขอบเร็ว สายเคเบิลที่เป็นเสาอากาศ และจุดความต้านทานสูงหรือขาลอย ล้วนเพิ่มการแผ่หรือการรับคลื่น ระนาบกราวด์เต็มแผ่นคือทางแก้ ไม่ใช่ต้นเหตุ
  - id: q4
    objective: 2
    type: single
    prompt:
      th: สัญญาณดิจิทัล 1 MHz ที่มีขอบขาขึ้น 1 ns มีพลังงานกระจายไปถึงความถี่ราวเท่าไร
      en: A 1 MHz digital signal with 1 ns edges has spectral content up to roughly what frequency?
    choices:
      - {th: 1 MHz}
      - {th: 2 MHz}
      - {th: ราว 350 MHz}
      - {th: 1 GHz ขึ้นไปเสมอ}
    answer: [2]
    explain:
      th: ใช้กฎหยาบ 0.35 / t_r = 0.35 / 1 ns ≈ 350 MHz ความเร็วของขอบ ไม่ใช่ความถี่ของสัญญาณ เป็นตัวกำหนดว่าคลื่นรบกวนไปถึงความถี่สูงแค่ไหน
  - id: q5
    objective: 3
    type: single
    prompt:
      th: ผลิตภัณฑ์ใช้โมดูล WiFi ที่ผ่านการรับรองแล้ว ข้อใดถูกต้องเกี่ยวกับการทดสอบก่อนวางขาย
      en: A product uses a certified WiFi module. Which is correct about testing before sale?
    choices:
      - {th: ไม่ต้องทดสอบอะไรอีก เพราะโมดูลผ่านแล้ว}
      - {th: ผลิตภัณฑ์ทั้งชิ้นยังต้องผ่านการทดสอบ EMC และความปลอดภัย และตรวจข้อกำหนดด้านวิทยุของประเทศที่จะขาย เพราะบอร์ด สาย และกล่องเปลี่ยนการแผ่คลื่นได้}
      - {th: ทดสอบเฉพาะความปลอดภัยทางไฟฟ้าก็พอ}
      - {th: ทดสอบเฉพาะในประเทศที่ผลิต ส่วนประเทศที่ขายไม่เกี่ยว}
    answer: [1]
    explain:
      th: คลื่นวิทยุเป็นทรัพยากรที่ใช้ร่วมกัน และอุปกรณ์ต้องไม่รบกวนผู้อื่นหรือทำงานผิดเมื่อถูกรบกวน การรับรองโมดูลครอบคลุมแค่ตัวโมดูล ผลิตภัณฑ์ต้องผ่านข้อกำหนดของตลาดที่ขาย เช่น กสทช. ในประเทศไทย
