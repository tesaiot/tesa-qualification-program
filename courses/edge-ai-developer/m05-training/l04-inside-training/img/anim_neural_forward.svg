<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="DejaVu Sans, sans-serif">
  <!-- Neural forward pass: a pulse of activation flows input -> hidden -> output. -->
  <text x="20" y="26" font-size="18" font-weight="700" fill="#1565c0">Forward Pass — สัญญาณไหลผ่านชั้นต่างๆ จนได้คำตอบ</text>
  <text x="55" y="58" font-size="12" fill="#666">input (feature)</text>
  <text x="330" y="58" font-size="12" fill="#666">hidden layers</text>
  <text x="620" y="58" font-size="12" fill="#666">output (3 คลาส)</text>
  <!-- edges -->
  <g stroke="#cfd8dc" stroke-width="1">
    <line x1="90" y1="110" x2="300" y2="100"/><line x1="90" y1="110" x2="300" y2="170"/><line x1="90" y1="110" x2="300" y2="240"/>
    <line x1="90" y1="180" x2="300" y2="100"/><line x1="90" y1="180" x2="300" y2="170"/><line x1="90" y1="180" x2="300" y2="240"/>
    <line x1="90" y1="250" x2="300" y2="100"/><line x1="90" y1="250" x2="300" y2="170"/><line x1="90" y1="250" x2="300" y2="240"/>
    <line x1="300" y1="100" x2="510" y2="100"/><line x1="300" y1="100" x2="510" y2="170"/><line x1="300" y1="100" x2="510" y2="240"/>
    <line x1="300" y1="170" x2="510" y2="100"/><line x1="300" y1="170" x2="510" y2="170"/><line x1="300" y1="170" x2="510" y2="240"/>
    <line x1="300" y1="240" x2="510" y2="100"/><line x1="300" y1="240" x2="510" y2="170"/><line x1="300" y1="240" x2="510" y2="240"/>
    <line x1="510" y1="100" x2="640" y2="130"/><line x1="510" y1="170" x2="640" y2="170"/><line x1="510" y1="240" x2="640" y2="210"/>
  </g>
  <!-- neurons -->
  <g fill="#eceff1" stroke="#90a4ae" stroke-width="1.5">
    <circle cx="90" cy="110" r="16"/><circle cx="90" cy="180" r="16"/><circle cx="90" cy="250" r="16"/>
    <circle cx="300" cy="100" r="16"/><circle cx="300" cy="170" r="16"/><circle cx="300" cy="240" r="16"/>
    <circle cx="510" cy="100" r="16"/><circle cx="510" cy="170" r="16"/><circle cx="510" cy="240" r="16"/>
  </g>
  <!-- output nodes -->
  <circle cx="640" cy="130" r="18" fill="#eceff1" stroke="#90a4ae"/><text x="662" y="134" font-size="12" fill="#333">idle</text>
  <circle cx="640" cy="170" r="18" fill="#2e7d32" stroke="#1b5e20"><animate attributeName="r" begin="1.4s" dur="0.5s" values="18;24;18" repeatCount="indefinite"/></circle><text x="662" y="174" font-size="12" font-weight="700" fill="#2e7d32">circle ✓</text>
  <circle cx="640" cy="210" r="18" fill="#eceff1" stroke="#90a4ae"/><text x="662" y="214" font-size="12" fill="#333">shake</text>
  <!-- travelling activation pulse -->
  <circle r="8" fill="#e53935" opacity="0.9">
    <animate attributeName="cx" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.33;0.66;1" values="90;300;510;640"/>
    <animate attributeName="cy" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.33;0.66;1" values="180;170;170;170"/>
  </circle>
  <text x="60" y="292" font-size="12" fill="#666">แต่ละเส้น = น้ำหนัก w · แต่ละวงกลม = คูณ-บวก แล้วผ่าน activation (ReLU) · ชั้นสุดท้าย = softmax → คลาส</text>
</svg>
