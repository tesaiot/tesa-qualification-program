<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="DejaVu Sans, sans-serif">
  <!-- Quantization: continuous float values snap to the nearest int8 grid step. -->
  <text x="20" y="26" font-size="18" font-weight="700" fill="#1565c0">Quantization — float32 ➜ int8 (โมเดลเล็กลง ~4 เท่า, เร็วขึ้น)</text>
  <!-- float line (continuous) -->
  <text x="40" y="66" font-size="13" fill="#666">float32 (ต่อเนื่อง)</text>
  <line x1="40" y1="80" x2="720" y2="80" stroke="#90a4ae" stroke-width="3"/>
  <g fill="#6a1b9a"><circle cx="150" cy="80" r="6"/><circle cx="315" cy="80" r="6"/><circle cx="470" cy="80" r="6"/><circle cx="610" cy="80" r="6"/></g>
  <!-- int8 grid (discrete steps) -->
  <text x="40" y="176" font-size="13" fill="#666">int8 (256 ขั้น: −128..127)</text>
  <line x1="40" y1="190" x2="720" y2="190" stroke="#bbb" stroke-width="2"/>
  <g stroke="#2e7d32" stroke-width="2">
    <line x1="90" y1="182" x2="90" y2="198"/><line x1="170" y1="182" x2="170" y2="198"/><line x1="250" y1="182" x2="250" y2="198"/>
    <line x1="330" y1="182" x2="330" y2="198"/><line x1="410" y1="182" x2="410" y2="198"/><line x1="490" y1="182" x2="490" y2="198"/>
    <line x1="570" y1="182" x2="570" y2="198"/><line x1="650" y1="182" x2="650" y2="198"/>
  </g>
  <!-- animated snap: dots drop from float positions to the nearest grid step -->
  <circle r="6" fill="#e53935"><animate attributeName="cx" values="150;170" dur="0.8s" begin="0.2s" fill="freeze"/><animate attributeName="cy" values="80;190" dur="0.8s" begin="0.2s" fill="freeze"/></circle>
  <circle r="6" fill="#e53935"><animate attributeName="cx" values="315;330" dur="0.8s" begin="0.5s" fill="freeze"/><animate attributeName="cy" values="80;190" dur="0.8s" begin="0.5s" fill="freeze"/></circle>
  <circle r="6" fill="#e53935"><animate attributeName="cx" values="470;490" dur="0.8s" begin="0.8s" fill="freeze"/><animate attributeName="cy" values="80;190" dur="0.8s" begin="0.8s" fill="freeze"/></circle>
  <circle r="6" fill="#e53935"><animate attributeName="cx" values="610;650" dur="0.8s" begin="1.1s" fill="freeze"/><animate attributeName="cy" values="80;190" dur="0.8s" begin="1.1s" fill="freeze"/></circle>
  <text x="40" y="130" font-size="12" fill="#999" font-style="italic">"snap" ไปขั้นที่ใกล้สุด — เสียความละเอียดนิดเดียว แต่ Ethos-U55 คูณ int8 ได้เร็วมาก</text>
  <text x="40" y="234" font-size="12" fill="#666">real ≈ scale × (q − zero_point)   ·   q = round(real/scale) + zero_point</text>
</svg>
