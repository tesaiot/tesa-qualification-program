  content: CC-BY-4.0
  code: MIT
source:
  note: Adapted from the author's Edge AI Developer course (2026-09)
modules:
- id: m01-onboarding
  title:
    th: 'เริ่มต้น: รันของจริงแล้วแกะดูข้างใน'
    en: 'Getting started: run the real thing, then take it apart'
  summary:
    th: รันโมเดล Edge AI ของจริงก่อน แล้วแกะแอปเซนเซอร์กับแอป Edge AI จนเห็นโครงร่วมสี่จังหวะ ทะเบียนโมเดล และเส้นทางจาก verdict สู่ action
- id: m02-daq
  title:
    th: เก็บข้อมูลจากเซนเซอร์ (DAQ)
    en: Data acquisition (DAQ)
  summary:
    th: เก็บข้อมูลจากเซนเซอร์ให้ตรงกับที่โมเดลต้องการ อัตราสุ่ม Nyquist หน้าต่าง schema ของ CSV และการเก็บ IMU กับเสียงบนเส้นเวลาเดียว
- id: m03-processing
  title:
    th: ประมวลผลด้วยคณิตศาสตร์และฟิสิกส์
    en: Processing with maths and physics
  summary:
    th: แปลงตัวเลขดิบเป็นปริมาณทางฟิสิกส์ (มุมเอียง พลังงาน ความสูง dBFS) ค่าอนุพัทธ์อย่าง dew point กับ heat index และจำแนกด้วยกฎก่อนใช้ ML
- id: m04-analysis
  title:
    th: วิเคราะห์สัญญาณ
    en: Signal analysis
  summary:
    th: ทำสัญญาณให้สะอาดด้วยฟิลเตอร์ DSP มองในโดเมนความถี่ด้วย FFT แล้วบีบหน้าต่างเลื่อนเป็น feature vector ที่โมเดลเห็นจริง
- id: m05-training
  title:
    th: ฝึกโมเดลและนำไปใช้หลายเป้าหมาย
    en: Training and deploying to several targets
  summary:
    th: เตรียม dataset ที่สมดุล ฝึกโมเดลของเราเองใน Docker บีบเป็น int8 แล้วพาไฟล์เดียวไปรันบนเว็บ Cortex-A และ MCU ผ่าน Vela พร้อมวัด parity
- id: m06-apps
  title:
    th: แอป Edge AI
    en: Edge AI apps
  summary:
    th: สร้างแอปที่โฟกัสโมเดลเดียว ต่อ verdict เข้ากับ action ผ่านท่อที่กัน false positive รวมกับเซนเซอร์ดิบ และส่งเหตุการณ์ขึ้น MQTT
- id: m07-under-the-hood
  title:
    th: ใต้ฝากระโปรงและการต่อเติม
    en: Under the hood and extending the firmware
  summary:
    th: แกะสแตกจาก MicroPython ข้าม IPC ไปถึง ai_engine และ NPU แล้วใช้แผนที่นั้นเพิ่มโมเดลของเราเองให้โผล่ใน edge_ai.models()
- id: m08-capstone
  title:
    th: 'Capstone: แอป Edge AI ของเราเอง'
    en: 'Capstone: your own edge AI app'
  summary:
    th: ออกแบบ สร้าง และส่งมอบ Guardian แอป Edge AI ที่ร้อยสามเสาไว้ในลูปเดียว พร้อมเหตุผลการออกแบบที่ยืนบนการวัด
