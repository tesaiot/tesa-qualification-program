schema_version: 1
id: edge-ai-developer
short: edgeai-dev
title:
  th: 'Edge AI Developer: จากเซนเซอร์สู่โมเดลบนอุปกรณ์'
  en: 'Edge AI Developer: From Sensor to On-Device Model'
summary:
  th: หลักสูตร Edge AI แบบครบวงจรด้วย MicroPython บนบอร์ด PSoC Edge (TESAIoT Dev Kit) เดินตามวงจรชีวิตของข้อมูลห้าเสา ตั้งแต่เก็บข้อมูลจากเซนเซอร์ ประมวลผล วิเคราะห์สัญญาณ ฝึกโมเดลของตัวเองแล้วนำไปรันบน MCU เว็บ และ PC จนถึงแอป Edge AI ที่เชื่อถือได้ แกะสแตกใต้ฝากระโปรง และ capstone ของตัวเอง
  en: 'An end-to-end, MicroPython-first edge AI course on the PSoC Edge board (TESAIoT Dev Kit) that follows the five pillars of the data lifecycle: sensor data acquisition, processing, signal analysis, training your own model and running it on the MCU, the web and the PC, and reliable edge AI apps, ending with the stack under the hood and a capstone of your own.'
level: L3
status: alpha
audience:
- developer
- student
- educator
hours: 60
cover:
  image: cover.webp
hardware:
  emulator: true
  boards:
  - devkit
toolchain:
  bento-firmware: BENTO MicroPython firmware for PSoC Edge E84 (TESAIoT Dev Kit) with the edge_ai model registry
  micropython: 'BENTO build: edge_ai, sensors, dsp, ui, lcd, wifi, mqtt'
  ide: BENTO IDE https://ide.tesaiot.dev/ (Program to Device, BENTO Emulator)
  training: Python 3 with TensorFlow, ai-edge-litert and ethos-u-vela in Docker (shared/training/Dockerfile) or Google Colab
  sdk: TESAIoT PSE84 DevKit SDK https://github.com/tesaiot/tesaiot-pse84-devkit-sdk (module 7)
prerequisites:
  courses:
  - aiot-micropython
  skills:
  - skill: lang.micropython
    level: 2
  - skill: lang.python
    level: 2
outcomes:
- th: อธิบายวงจรชีวิตของข้อมูลห้าขั้นใน Edge AI และใช้โมดูล edge_ai เลือกโมเดลจากทะเบียน อ่าน verdict และต่อเข้ากับ action บนบอร์ดได้
  en: Explain the five-stage edge AI data lifecycle, and use the edge_ai module to pick a model from the registry, read its verdict and wire it to an action on the board.
- th: เก็บข้อมูลเซนเซอร์ที่ติดป้ายลง CSV ที่อัตราสุ่มคงที่ และเตรียม dataset ที่สมดุล แบ่ง train/val/test แบบ stratified โดยไม่มีข้อมูลรั่ว
  en: Log labelled sensor data to CSV at a steady sample rate, and prepare a balanced dataset with a stratified train/val/test split and no data leakage.
- th: แปลงสัญญาณดิบเป็นปริมาณทางฟิสิกส์และ feature ด้วยฟิลเตอร์ FFT และหน้าต่างเลื่อน และวัดผลของแต่ละขั้นด้วยตัวเลข
  en: Turn raw signals into physical quantities and features with filters, the FFT and sliding windows, and measure the effect of each step with numbers.
- th: ฝึกโมเดล Conv1D ใน Docker บีบเป็น int8 แล้ววัด accuracy และ latency บน PC เว็บ และ MCU ผ่าน Vela พร้อมพิสูจน์ parity ภายในเกณฑ์ TOL
  en: Train a Conv1D model in Docker, quantise it to int8, and measure its accuracy and latency on the PC, the web and the MCU through Vela, proving parity within a tolerance.
- th: สร้างแอป Edge AI ที่กัน false positive ด้วย CONF_FLOOR, debounce และ cooldown รวม verdict กับเซนเซอร์ดิบ และส่งเหตุการณ์ขึ้น MQTT
  en: Build edge AI apps that resist false positives with CONF_FLOOR, debounce and cooldown, fuse the verdict with a raw sensor, and publish events over MQTT.
- th: อธิบายสแตกจาก MicroPython ถึง NPU เพิ่มโมเดลเข้าเฟิร์มแวร์ และส่งมอบ capstone ที่ข้ามอย่างน้อยสามเสาพร้อมเหตุผลการออกแบบที่ยืนบนการวัด
  en: Explain the stack from MicroPython down to the NPU, add a model to the firmware, and deliver a capstone that crosses at least three pillars with design reasons backed by measurements.
authors:
- name: รศ.วิรุฬห์ ศรีบริรักษ์ วิศวกรรมระบบสมองกลฝังตัว ภาควิชาวิศวกรรมไฟฟ้า คณะวิศวกรรมศาสตร์ มหาวิทยาลัยบูรพา (BUU)
  role: author
- name: 'สมาคมสมองกลฝังตัวไทย (Thai Embedded Systems Association: TESA)'
  url: https://github.com/tesaiot/tesa-qualification-program
  role: adapter
sponsors:
- TESA
