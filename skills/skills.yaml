#
# TESA Embedded Systems Skill Map — the single source of truth for skill IDs.
# Adapted from "Embedded Systems Engineering Roadmap" by Meysam Parvizi (see skills/NOTICE.md).
#
# Rules (enforced by tools/validate.py):
#   - An id is permanent. Never rename or reuse one; retire it with `deprecated: true` + `replaced_by:`.
#   - ids are vendor-neutral: PSoC Edge, ModusToolbox, BENTO belong in a lesson's `context:`, not here.
#   - `origin`: eer = a node on the roadmap diagram v1.2.3 · eer-readme = a topic only in the newer
#     roadmap README · tesa = added by TESA.
#   - `importance` is the roadmap's own colour (R / Rec / P); null for skills TESA added.
#     Role profiles in skills/roles/ may promote a skill for a given role.
#   - A skill's stable UUID is uuid5(NAMESPACE_URL, "https://tesaiot.github.io/tesa-qualification-program/skills/<id>/"),
#     computed by tools, never stored.

